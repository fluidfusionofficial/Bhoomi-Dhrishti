                  - cell [ref=f12e221]:
                    - link "typesafe.ai" [ref=f12e223] [cursor=pointer]:
                      - /url: https://typesafe.ai
            - paragraph [ref=f12e224]:
              - text: Jev is a
              - link "proprietary" [ref=f12e225] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Proprietary_software
              - link "artificial intelligence" [ref=f12e226] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Artificial_intelligence
              - text: model developed by
              - link "TypeSafe AI" [ref=f12e227] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/TypeSafe_AI?action=edit&redlink=1
              - text: ", a"
              - link "San Francisco" [ref=f12e228] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/San_Francisco
              - text: –based company founded in 2024. It was released in limited early access on 15 September 2026, alongside the announcement of a US$40 million
              - link "seed round" [ref=f12e229] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Seed_funding
              - text: led by DCVC.
              - superscript [ref=f12e230]:
                - link "[1]" [ref=f12e231] [cursor=pointer]:
                  - /url: "#cite_note-forbes-1"
              - superscript [ref=f12e233]:
                - link "[2]" [ref=f12e234] [cursor=pointer]:
                  - /url: "#cite_note-techcrunch-2"
            - paragraph [ref=f12e236]:
              - text: Unlike a
              - link "large language model" [ref=f12e237] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Large_language_model
              - text: (LLM), Jev does not generate natural-language text. It instead returns typed values together with probability estimates and confidence scores. Its output is intended to be consumed directly by other software rather than read by a person.
              - superscript [ref=f12e238]:
                - link "[1]" [ref=f12e239] [cursor=pointer]:
                  - /url: "#cite_note-forbes-1"
              - superscript [ref=f12e241]:
                - link "[3]" [ref=f12e242] [cursor=pointer]:
                  - /url: "#cite_note-register-3"
            - paragraph [ref=f12e244]:
              - text: TypeSafe describes it as the first of a class of models it calls "
              - link "System One models" [ref=f12e245] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Thinking,_Fast_and_Slow#Two_systems
              - text: "\"."
              - superscript [ref=f12e246]:
                - link "[2]" [ref=f12e247] [cursor=pointer]:
                  - /url: "#cite_note-techcrunch-2"
              - superscript [ref=f12e249]:
                - link "[4]" [ref=f12e250] [cursor=pointer]:
                  - /url: "#cite_note-rundown-4"
          - region [ref=f12e252]:
            - generic [ref=f12e253]:
              - heading "Background" [level=2] [ref=f12e254]
              - generic [ref=f12e255]:
                - link "edit":
                  - /url: /w/index.php?title=Jev_(AI_model)&action=edit&section=1
            - paragraph [ref=f12e256]:
              - text: TypeSafe AI was founded in 2024 by Diogo Almeida, Erik Gafni and Sasha Sheng. Almeida, the company's chief executive, spent approximately four years at
              - link "OpenAI" [ref=f12e257] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/OpenAI
              - text: working on
              - link "reinforcement learning from human feedback" [ref=f12e258] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Reinforcement_learning_from_human_feedback
              - text: (RLHF), InstructGPT,
              - link "ChatGPT" [ref=f12e259] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/ChatGPT
              - text: and
              - link "GPT-4" [ref=f12e260] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/GPT-4
              - text: before leaving in 2024.
              - superscript [ref=f12e261]:
                - link "[1]" [ref=f12e262] [cursor=pointer]:
                  - /url: "#cite_note-forbes-1"
              - superscript [ref=f12e264]:
                - link "[5]" [ref=f12e265] [cursor=pointer]:
                  - /url: "#cite_note-siliconangle-5"
            - paragraph [ref=f12e267]:
              - text: The company positions Jev as a reliable model for automation and software, and as a response to overconfidence in existing models.
              - link "Forbes" [ref=f12e269] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Forbes
              - text: ": \"We've been optimizing for humans and we're super human at pleasing humans.\""
              - superscript [ref=f12e270]:
                - link "[1]" [ref=f12e271] [cursor=pointer]:
                  - /url: "#cite_note-forbes-1"
              - text: He has separately described his disappointment with conversational models as the origin of the project, telling
              - link "TechCrunch" [ref=f12e274] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/TechCrunch
              - text: that the technology amounted to "lightning in a bottle" that was nonetheless not useful.
              - superscript [ref=f12e275]:
                - link "[2]" [ref=f12e276] [cursor=pointer]:
                  - /url: "#cite_note-techcrunch-2"
            - paragraph [ref=f12e278]:
              - text: Before the announcement, Jev was being developed in stealth for roughly two years.
              - superscript [ref=f12e279]:
                - link "[2]" [ref=f12e280] [cursor=pointer]:
                  - /url: "#cite_note-techcrunch-2"
              - text: Forbes reported that the round valued TypeSafe at US$200 million.
              - superscript [ref=f12e282]:
                - link "[1]" [ref=f12e283] [cursor=pointer]:
                  - /url: "#cite_note-forbes-1"
          - region [ref=f12e285]:
            - generic [ref=f12e286]:
              - heading "Design & architecture" [level=2] [ref=f12e287]
              - generic [ref=f12e288]:
                - link "edit":
                  - /url: /w/index.php?title=Jev_(AI_model)&action=edit&section=2
            - paragraph [ref=f12e289]:
              - text: A Jev request consists of a block of state (a string,
              - link "JSON" [ref=f12e290] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/JSON
              - text: object or array of text) together with one or more typed questions. The model evaluates every question against the state in a single parallel pass and returns structured answers rather than plain text.
              - superscript [ref=f12e291]:
                - link "[3]" [ref=f12e292] [cursor=pointer]:
                  - /url: "#cite_note-register-3"
              - superscript [ref=f12e294]:
                - link "[6]" [ref=f12e295] [cursor=pointer]:
                  - /url: "#cite_note-docs-intro-6"
            - paragraph [ref=f12e297]:
              - text: "Jev allows three question types (also called primitives):"
              - superscript [ref=f12e298]:
                - link "[6]" [ref=f12e299] [cursor=pointer]:
                  - /url: "#cite_note-docs-intro-6"
              - superscript [ref=f12e301]:
                - link "[3]" [ref=f12e302] [cursor=pointer]:
                  - /url: "#cite_note-register-3"
              - superscript [ref=f12e304]:
                - link "[7]" [ref=f12e305] [cursor=pointer]:
                  - /url: "#cite_note-docs-models-7"
            - table [ref=f12e307]:
              - rowgroup [ref=f12e308]:
                - row [ref=f12e309]:
                  - columnheader "Primitive" [ref=f12e310]
                  - columnheader "Purpose" [ref=f12e311]
                  - columnheader "Returns" [ref=f12e312]
                - row [ref=f12e313]:
                  - cell "Choice" [ref=f12e314]
                  - cell "Select one option from a defined set" [ref=f12e315]
                  - cell "Selected option, per-option probabilities, confidence" [ref=f12e316]
                - row [ref=f12e317]:
                  - cell "Score" [ref=f12e318]
                  - cell "Rate the state against ordered levels" [ref=f12e319]
                  - cell "Score, per-level probabilities, confidence" [ref=f12e320]
                - row [ref=f12e321]:
                  - cell "Noul" [ref=f12e322]
                  - cell "Evaluate a yes/no statement" [ref=f12e323]
                  - cell "Probability between 0 and 1" [ref=f12e324]
            - paragraph [ref=f12e325]:
              - text: Because the answers are defined in advance, the model cannot return a value outside the supplied schema. TypeSafe presents this as eliminating
              - link "hallucination" [ref=f12e326] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Hallucination_(artificial_intelligence)
              - text: and type errors.
              - superscript [ref=f12e327]:
                - link "[2]" [ref=f12e328] [cursor=pointer]:
                  - /url: "#cite_note-techcrunch-2"
              - superscript [ref=f12e330]:
                - link "[8]" [ref=f12e331] [cursor=pointer]:
                  - /url: "#cite_note-typesafe-blog-8"
            - paragraph [ref=f12e333]:
              - text: However, TypeSafe has not published Jev's exact architecture, weights, or a technical paper. The company describes the model as
              - link "transformer" [ref=f12e334] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Transformer_(deep_learning_architecture)
              - text: "-based and trained exclusively on"
              - link "synthetic data" [ref=f12e335] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Synthetic_data
              - text: . The method of training is Reinforcement Learning for Calibrated Decisions (RLCD), where probabilities are optimized against outcomes rather than against human rater preference. Outside observers have suggested the model may be built on an open-weight LLM.
              - superscript [ref=f12e336]:
                - link "[2]" [ref=f12e337] [cursor=pointer]:
                  - /url: "#cite_note-techcrunch-2"
              - superscript [ref=f12e339]:
                - link "[3]" [ref=f12e340] [cursor=pointer]:
                  - /url: "#cite_note-register-3"
            - region [ref=f12e342]:
              - generic [ref=f12e343]:
                - heading "Performance claims" [level=3] [ref=f12e344]
                - generic [ref=f12e345]:
                  - link "edit":
                    - /url: /w/index.php?title=Jev_(AI_model)&action=edit&section=3
              - paragraph [ref=f12e346]:
                - text: TypeSafe reports end-to-end response times of 70 to 500 milliseconds. The company claims that Jev is 40 to 200 times faster and 40 to 400 times cheaper than frontier LLMs on comparable tasks, with peak figures of 193.6 times faster and 444.6 times cheaper on its own workflows.
                - superscript [ref=f12e347]:
                  - link "[8]" [ref=f12e348] [cursor=pointer]:
                    - /url: "#cite_note-typesafe-blog-8"
                - superscript [ref=f12e350]:
                  - link "[3]" [ref=f12e351] [cursor=pointer]:
                    - /url: "#cite_note-register-3"
              - paragraph [ref=f12e353]:
                - text: TypeSafe states in its own technical notes that the workflows were created by members of its model-capabilities team, acknowledges possible bias, and describes the reported gains as likely to sit at the high end of real-world results.
                - superscript [ref=f12e354]:
                  - link "[8]" [ref=f12e355] [cursor=pointer]:
                    - /url: "#cite_note-typesafe-blog-8"
                - superscript [ref=f12e357]:
                  - link "[9]" [ref=f12e358] [cursor=pointer]:
                    - /url: "#cite_note-ts2-9"
              - paragraph [ref=f12e360]
          - region [ref=f12e361]:
            - generic [ref=f12e362]:
              - heading "Name" [level=2] [ref=f12e363]
              - generic [ref=f12e364]:
                - link "edit":
                  - /url: /w/index.php?title=Jev_(AI_model)&action=edit&section=4
            - paragraph [ref=f12e365]:
              - text: The model is named after 19th-century English economist
              - link "William Stanley Jevons" [ref=f12e366] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/William_Stanley_Jevons
              - text: ", whose"
              - link "Jevons paradox" [ref=f12e367] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Jevons_paradox
              - text: describes how more efficient use of a resource can increase consumption. Almeida has said the name reflects an expectation that cheaper machine intelligence will lead to far wider deployment.
              - superscript [ref=f12e368]:
                - link "[3]" [ref=f12e369] [cursor=pointer]:
                  - /url: "#cite_note-register-3"
              - superscript [ref=f12e371]:
                - link "[2]" [ref=f12e372] [cursor=pointer]:
                  - /url: "#cite_note-techcrunch-2"
          - region [ref=f12e374]:
            - generic [ref=f12e375]:
              - heading "References" [level=2] [ref=f12e376]
              - generic [ref=f12e377]:
                - link "edit":
                  - /url: /w/index.php?title=Jev_(AI_model)&action=edit&section=5
