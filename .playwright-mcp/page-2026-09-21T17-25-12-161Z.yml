                      - generic [ref=f4e1055]:
                        - heading "1. Introduction" [level=2] [ref=f4e1056]
                        - generic [ref=f4e1057]:
                          - text: In modern governance, municipalities serve as foundational structures for managing and addressing the needs of local populations. As the primary territorial entities in Spain, municipalities enjoy significant autonomy and authority in administrative, economic, social, and regulatory domains, enabling them to respond directly to community needs [
                          - link "Reference 1" [ref=f4e1058] [cursor=pointer]: "1"
                          - text: "]. Municipal governments, organized through city councils, are tasked with governance, regulatory functions, financial oversight, and the provision of essential public services, as established by the Local Government Regime ["
                          - link "Reference 1" [ref=f4e1059] [cursor=pointer]: "1"
                          - text: "]. However, this autonomy also presents challenges, particularly in achieving semantic interoperability across municipal administrative units—a critical requirement for efficient and coordinated public administration ["
                          - link "Reference 2" [ref=f4e1060] [cursor=pointer]: "2"
                          - text: "]."
                        - generic [ref=f4e1061]:
                          - text: As public administration undergoes rapid digital transformation, municipalities increasingly rely on electronic systems for processes such as document authentication, data sharing, and regulatory compliance [
