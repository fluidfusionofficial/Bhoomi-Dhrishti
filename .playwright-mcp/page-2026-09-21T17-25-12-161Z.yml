                        - generic [ref=f4e1313]:
                          - heading "5.3. Communication Efficiency" [level=3] [ref=f4e1314]
                          - generic [ref=f4e1315]:
                            - text: Effective communication is essential for the coordination of municipal agents. By utilizing JADE’s FIPA-ACL messaging protocol, structured and reliable information exchange among agents is ensured. The system demonstrated effective communication performance, with response times averaging 120 ms, allowing for near real-time task management. However, variations in latency have been observed depending on agent types and message complexity, as
                            - link "Figure 4" [ref=f4e1316] [cursor=pointer]:
                              - /url: "#applsci-15-03146-f004"
                            - text: illustrates, which compares latency across the MayorAgent, SecretariatAgent, TreasuryAgent, EventManagementAgent, and CitizenAgent. Additionally, message reliability remained high, with a 98% success rate, minimizing communication interruptions and ensuring seamless task execution. These results highlight the system’s capability to maintain efficient and dependable communication, which is critical for effective municipal operations.
                          - generic [ref=f4e1317]:
