                        - heading "2. Related Work" [level=2] [ref=f4e1083]
                        - generic [ref=f4e1084]:
                          - text: In [
                          - link "Reference 4" [ref=f4e1085] [cursor=pointer]: "4"
                          - text: "], regarding control schemas in multi-agent systems (MASs), a minimal-approximation-based event-triggered leader-following consensus control scheme is described. This scheme has been shown to outperform others, particularly for nonlinear MASs with unknown actuator dead zones. Additionally, an adaptive event-triggered control strategy relying solely on local information has been proposed ["
                          - link "Reference 7" [ref=f4e1086] [cursor=pointer]: "7"
                          - text: "]. These authors have also derived a model-based stability condition guaranteeing MASs’ asymptotic consensus."
                        - generic [ref=f4e1087]:
                          - text: Containment control has been defined as a modality aimed at constructing a control protocol through data exchange among neighboring agents, ensuring that all follower outputs converge within a predefined region determined by the leaders [
                          - link "Reference 8" [ref=f4e1088] [cursor=pointer]: "8"
                          - text: "]. The authors addressed disturbances in internal dynamics using a Fourier series expansion and a neural network-based adaptive identifier for each follower, thereby relaxing constraints on the system’s dynamics. In this study, optimized virtual and actual controllers were derived through adaptive dynamic programming under a simplified actor–critic architecture ["
                          - link "Reference 9" [ref=f4e1089] [cursor=pointer]: "9"
                          - text: "]. Here, the value function evaluates control performance, while the actor executes the control tasks."
                        - generic [ref=f4e1090]:
