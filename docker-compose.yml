    ports:
      - "${PARCEL_IDENTITY_PORT:-8001}:8000"
    environment:
      SERVICE_NAME: parcel-identity
      PORT: 8000
    volumes:
      - service-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

