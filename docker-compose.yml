# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  bhoomi-net:
    name: bhoomi-dhrishti-network
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres-data:
    name: bhoomi-postgres-data
  redis-data:
    name: bhoomi-redis-data
  rabbitmq-data:
    name: bhoomi-rabbitmq-data
  prometheus-data:
    name: bhoomi-prometheus-data
  grafana-data:
    name: bhoomi-grafana-data
  service-logs:
    name: bhoomi-service-logs
  ml-models:
    name: bhoomi-ml-models
