# Tamil Nadu Rural Revenue Records Mapping Configuration
# Source: Tamil Nadu Revenue Department - Patta Chitta System
# Target: Bhoomi Dhrishti canonical revenue schema (LADM-aligned)
# Version: 1.0
# Last Updated: 2026-09-15

source_type: revenue_ror
source_system: TN_BHOOMI
source_department: TN Revenue Department

metadata:
  state_code: "33"
  state_name: "Tamil Nadu"
  lgd_state_code: "33"
  department: "revenue"
  contact_email: "revenue-it@tn.gov.in"
  encoding: "utf-8"
  delimiter: ","
  header_row: 1

# Field mapping from source to canonical schema
field_mapping:
  # Survey identification
  survey_number:
    source_field: "Survey_No"
    transform: normalize_survey_number
    type: str
    description: "Normalized survey number (e.g., 123/4A)"

  # Area measurements
  area_native:
    source_field: "Extent"
    type: float
    description: "Area in native unit (before conversion)"

  unit_native:
    source_field: "Unit"
    type: str
    description: "Native area unit (cent, acre, veli, etc.)"

  area_sq_m:
    source_field: "Extent"
    transform: convert_area
    type: float
    description: "Area converted to square meters"

  # Owner information
  owner_name:
    source_field: "Pattadar_Name"
    type: str
    description: "Owner/Pattadar name in English"

  owner_name_local:
    source_field: "Pattadar_Name_Tamil"
    type: str
    description: "Owner name in Tamil script"

  owner_name_phonetic:
    source_field: "Pattadar_Name_Tamil"
    transform: transliterate_to_latin
    script: tamil
    description: "Phonetic transliteration for matching"

  # Location hierarchy
  district_code:
    source_field: "District_Code"
    type: str
    description: "District LGD code"

  village_code:
    source_field: "Village_Code"
    type: str
    description: "Village LGD code"

  # Land classification
  land_use:
    source_field: "Land_Class"
    type: str
    description: "Land use classification code"

  # Temporal data
  registration_date:
    source_field: "Patta_Date"
    transform: normalize_date
    description: "Date of Patta registration"

  # Additional identifiers
  field_measurement_book_no:
    source_field: "FMB_No"
    transform: normalize_survey_number
    type: str
    description: "Field Measurement Book number"

  chitta_number:
    source_field: "Chitta_No"
    type: str
    description: "Chitta (ownership ledger) number"

  # Geometry (if available)
  geometry_wkt:
    source_field: "Geometry_WKT"
    transform: validate_geometry
    type: str
    description: "Parcel boundary as WKT"

# Unit conversion factors (district-specific overrides)
conversions:
  area_units:
    cent: 40.47      # sq_m per cent
    acre: 4046.86    # sq_m per acre
    veli: 6670.0     # sq_m per veli (Tamil Nadu)
    kuli: 1.67       # sq_m per kuli (Tamil Nadu)
    ground: 223.0    # sq_m per ground (South India)

# Data quality rules
data_quality:
  required_fields:
    - survey_number
    - district_code
    - area_native

  unique_fields:
    - survey_number  # Within district+village

  validation_rules:
    area_native:
      min: 0.01
      max: 10000  # 10,000 native units max
    area_sq_m:
      min: 0.4     # ~0.01 cent
      max: 1000000 # 100 hectares

  outlier_detection:
    enabled: true
    z_score_threshold: 3.5
    fields:
      - area_sq_m
      - area_native

# Cross-source matching configuration
matching:
  enabled: true
  match_fields:
    primary:
      - survey_number
      - district_code
      - village_code
    fuzzy:
      - owner_name_phonetic
  confidence_threshold: 0.85

# Audit and lineage
audit:
  track_source_file: true
  track_import_timestamp: true
  track_data_quality_score: true
  retain_raw_values: false

# Notes for data stewards
notes: |
  - Tamil Nadu uses cent as primary unit in rural areas
  - Veli and kuli are traditional Tamil units still in use
  - Survey numbers may have multiple components (e.g., 123/4A, 123/4B)
  - Pattadar Name may be in English, Tamil, or both
  - FMB (Field Measurement Book) numbers link to cadastral maps
  - Chitta numbers are unique within a village
