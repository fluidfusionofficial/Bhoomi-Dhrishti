
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>BHOOMI DHRISHTI — Integrated Parcel-Centric Land Governance Platform</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
/* ============================================================
   BHOOMI DHRISHTI — Module 1 Prototype
   Civic / government GIS aesthetic
   Palette: deep blue, teal/green, white, light grey, amber, red
   ============================================================ */
:root{
  --blue-900:#0b2447;
  --blue-800:#12315e;
  --blue-700:#1b4079;
  --blue-600:#2456a6;
  --blue-500:#3b6fbf;
  --blue-050:#eef3fb;
  --teal-700:#0f766e;
  --teal-600:#118a80;
  --teal-500:#14a89a;
  --teal-050:#e6f6f4;
  --green:#16a34a;
  --green-bg:#e7f6ec;
  --amber:#d97706;
  --amber-bg:#fdf1e0;
  --red:#dc2626;
  --red-bg:#fdeaea;
  --grey-900:#1f2733;
  --grey-700:#425066;
  --grey-500:#6b7688;
  --grey-400:#9aa4b3;
  --grey-300:#cbd3de;
  --grey-200:#e3e8ef;
  --grey-100:#f1f4f8;
  --grey-050:#f7f9fc;
  --white:#ffffff;
  --shadow-sm:0 1px 2px rgba(11,36,71,.06),0 1px 3px rgba(11,36,71,.08);
  --shadow-md:0 4px 12px rgba(11,36,71,.10),0 2px 4px rgba(11,36,71,.06);
  --shadow-lg:0 12px 32px rgba(11,36,71,.16),0 4px 8px rgba(11,36,71,.08);
  --r-sm:6px; --r-md:10px; --r-lg:14px;
  --font: "Inter","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:"SFMono-Regular",ui-monospace,"Cascadia Code",Menlo,Consolas,monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font);
  color:var(--grey-900);
  background:var(--grey-100);
  font-size:14px;line-height:1.5;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button{font-family:inherit;cursor:pointer;border:none;background:none;}
:focus-visible{outline:3px solid var(--blue-500);outline-offset:2px;border-radius:4px;}
.app{display:flex;flex-direction:column;height:100vh;}

/* ---------- DEMO BANNER (sec 6,25,42,43) ---------- */
.demo-banner{
  background:repeating-linear-gradient(45deg,var(--amber) 0 14px,#c96a05 14px 28px);
  color:#fff;font-size:11.5px;font-weight:700;letter-spacing:.06em;
  text-align:center;padding:4px 12px;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;
}
.demo-banner .dot{width:6px;height:6px;border-radius:50%;background:#fff;opacity:.9;}

/* ---------- HEADER (sec 11,12) ---------- */
.header{
  background:linear-gradient(180deg,var(--blue-900),var(--blue-800));
  color:#fff;display:flex;align-items:center;gap:16px;
  padding:0 18px;height:64px;flex-shrink:0;box-shadow:var(--shadow-md);z-index:1200;
}
.brand{display:flex;align-items:center;gap:12px;min-width:max-content;}
.brand .seal{
  width:40px;height:40px;border-radius:9px;flex-shrink:0;
  background:linear-gradient(135deg,var(--teal-500),var(--teal-700));
  display:grid;place-items:center;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.25);
}
.brand .seal svg{width:24px;height:24px;}
.brand .titles h1{font-size:16.5px;font-weight:800;margin:0;letter-spacing:.02em;line-height:1.1;}
.brand .titles .sub{font-size:10.5px;color:#aac4e8;letter-spacing:.03em;margin-top:1px;}

.header-search{flex:1;max-width:520px;position:relative;}
.search-wrap{position:relative;}
.search-wrap input{
  width:100%;height:40px;border-radius:var(--r-md);border:1.5px solid rgba(255,255,255,.18);
  background:rgba(255,255,255,.10);color:#fff;padding:0 38px 0 40px;font-size:13.5px;
  transition:.16s;
}
.search-wrap input::placeholder{color:#b9cbe6;}
.search-wrap input:focus{background:#fff;color:var(--grey-900);border-color:var(--teal-500);outline:none;}
.search-wrap input:focus::placeholder{color:var(--grey-400);}
.search-wrap .s-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);pointer-events:none;color:#b9cbe6;}
.search-wrap input:focus ~ .s-icon{color:var(--grey-500);}
.search-wrap .s-clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--grey-400);display:none;font-size:16px;padding:2px 6px;border-radius:5px;}
.search-wrap .s-clear:hover{background:var(--grey-100);color:var(--grey-700);}
.suggestions{
  position:absolute;top:46px;left:0;right:0;background:#fff;border-radius:var(--r-md);
  box-shadow:var(--shadow-lg);overflow:hidden;z-index:1300;display:none;max-height:340px;overflow-y:auto;
  border:1px solid var(--grey-200);
}
.suggestions .s-head{padding:8px 14px;font-size:11px;font-weight:700;color:var(--grey-500);
  text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--grey-100);background:var(--grey-050);}
.sugg-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid var(--grey-100);}
.sugg-item:last-child{border-bottom:none;}
.sugg-item:hover,.sugg-item.active{background:var(--blue-050);}
.sugg-item .sid{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--blue-700);
  background:var(--blue-050);padding:2px 6px;border-radius:5px;min-width:max-content;}
.sugg-item .smeta{flex:1;min-width:0;}
.sugg-item .smeta .l1{font-weight:600;font-size:13px;color:var(--grey-900);}
.sugg-item .smeta .l2{font-size:11.5px;color:var(--grey-500);}
.sugg-empty{padding:16px 14px;color:var(--grey-500);font-size:13px;text-align:center;}

.header-controls{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:max-content;}
.seg{display:flex;background:rgba(255,255,255,.10);border-radius:var(--r-md);padding:3px;gap:2px;border:1px solid rgba(255,255,255,.14);}
.seg button{color:#c7d8f0;font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:7px;transition:.14s;white-space:nowrap;}
.seg button.on{background:#fff;color:var(--blue-800);box-shadow:var(--shadow-sm);}
.seg button:not(.on):hover{color:#fff;background:rgba(255,255,255,.08);}
.btn-sih{
  background:linear-gradient(135deg,var(--teal-500),var(--teal-700));color:#fff;font-weight:700;
  font-size:12.5px;padding:9px 15px;border-radius:var(--r-md);box-shadow:var(--shadow-sm);
  display:flex;align-items:center;gap:7px;white-space:nowrap;transition:.14s;
}
.btn-sih:hover{filter:brightness(1.08);box-shadow:var(--shadow-md);}
.btn-sih .pulse{width:7px;height:7px;border-radius:50%;background:#baffef;box-shadow:0 0 0 0 rgba(186,255,239,.8);animation:pulse 2s infinite;}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(186,255,239,.7);}70%{box-shadow:0 0 0 7px rgba(186,255,239,0);}100%{box-shadow:0 0 0 0 rgba(186,255,239,0);}}

/* ---------- KPI STRIP (sec 11) ---------- */
.kpi-strip{
  background:#fff;display:flex;align-items:stretch;gap:0;flex-shrink:0;
  border-bottom:1px solid var(--grey-200);box-shadow:var(--shadow-sm);z-index:900;overflow-x:auto;
}
.kpi{display:flex;align-items:center;gap:11px;padding:11px 20px;border-right:1px solid var(--grey-100);min-width:max-content;}
.kpi .k-ic{width:34px;height:34px;border-radius:9px;display:grid;place-items:center;flex-shrink:0;}
.kpi .k-val{font-size:19px;font-weight:800;line-height:1;color:var(--grey-900);}
.kpi .k-lab{font-size:11px;color:var(--grey-500);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:3px;}
.kpi.total .k-ic{background:var(--blue-050);color:var(--blue-700);}
.kpi.verified .k-ic{background:var(--green-bg);color:var(--green);}
.kpi.conflict .k-ic{background:var(--red-bg);color:var(--red);}
.kpi.risk .k-ic{background:var(--amber-bg);color:var(--amber);}
.kpi-tagline{margin-left:auto;display:flex;align-items:center;padding:0 22px;gap:14px;min-width:max-content;}
.kpi-tagline .tag-main{font-size:13px;font-weight:800;color:var(--blue-800);letter-spacing:.03em;}
.kpi-tagline .tag-sub{font-size:11px;color:var(--grey-500);max-width:230px;line-height:1.35;}

/* ---------- MAIN LAYOUT ---------- */
.main{flex:1;display:flex;min-height:0;position:relative;}

/* ---------- LEFT LAYER/FILTER PANEL (sec 19,20) ---------- */
.left-panel{
  width:274px;flex-shrink:0;background:#fff;border-right:1px solid var(--grey-200);
  display:flex;flex-direction:column;z-index:800;box-shadow:var(--shadow-sm);overflow-y:auto;
}
/* three-category layer headers (Extension) */
.layer-cat{display:flex;align-items:center;gap:7px;margin:14px 0 8px;font-size:11px;font-weight:800;
  color:var(--blue-800);text-transform:uppercase;letter-spacing:.05em;}
.layer-cat:first-of-type{margin-top:0;}
.layer-cat.gov{color:var(--teal-700);}
.layer-cat.svc{color:var(--amber);}
.layer-cat .lc-num{width:18px;height:18px;border-radius:5px;background:var(--blue-600);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:11px;flex-shrink:0;}
.layer-cat.gov .lc-num{background:var(--teal-600);}
.layer-cat.svc .lc-num{background:var(--amber);}
.layer-cat .lc-hint{margin-left:auto;font-size:9px;font-weight:600;color:var(--grey-400);text-transform:none;letter-spacing:0;}
.panel-sec{border-bottom:1px solid var(--grey-100);padding:14px 16px;}
.panel-sec h3{font-size:11px;font-weight:800;color:var(--grey-500);text-transform:uppercase;
  letter-spacing:.07em;margin:0 0 11px;display:flex;align-items:center;gap:7px;}
.panel-sec h3 .h-line{flex:1;height:1px;background:var(--grey-200);}
.layer-group-label{font-size:10px;font-weight:800;color:var(--grey-400);letter-spacing:.08em;
  text-transform:uppercase;margin:12px 0 7px;}
.layer-group-label:first-of-type{margin-top:0;}
.toggle-row{display:flex;align-items:center;gap:10px;padding:7px 0;cursor:pointer;user-select:none;}
.toggle-row:hover .t-label{color:var(--blue-700);}
.switch{width:34px;height:20px;border-radius:20px;background:var(--grey-300);position:relative;transition:.18s;flex-shrink:0;}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:var(--shadow-sm);transition:.18s;}
.toggle-row.on .switch{background:var(--teal-600);}
.toggle-row.on .switch::after{transform:translateX(14px);}
.t-label{font-size:13px;font-weight:600;color:var(--grey-700);flex:1;}
.t-swatch{width:14px;height:14px;border-radius:4px;flex-shrink:0;border:1px solid rgba(0,0,0,.08);}

.filter-group{margin-bottom:14px;}
.filter-group:last-child{margin-bottom:0;}
.filter-group .fg-label{font-size:11.5px;font-weight:700;color:var(--grey-700);margin-bottom:7px;}
.chip-row{display:flex;flex-wrap:wrap;gap:6px;}
.chip{font-size:11.5px;font-weight:600;padding:5px 11px;border-radius:20px;background:var(--grey-100);
  color:var(--grey-700);border:1.5px solid transparent;transition:.13s;}
.chip:hover{background:var(--grey-200);}
.chip.on{background:var(--blue-700);color:#fff;border-color:var(--blue-700);}
.filter-reset{width:100%;margin-top:4px;font-size:12px;font-weight:600;color:var(--blue-700);
  padding:7px;border-radius:var(--r-sm);background:var(--blue-050);transition:.13s;}
.filter-reset:hover{background:var(--blue-050);filter:brightness(.97);}
.result-count{font-size:11.5px;color:var(--grey-500);margin-top:10px;text-align:center;font-weight:600;}

/* ---------- MAP (sec 13) ---------- */
.map-wrap{flex:1;position:relative;min-width:0;background:var(--grey-200);}
#map{position:absolute;inset:0;z-index:1;}
.leaflet-container{background:#dfe6ef;font-family:var(--font);}
.map-title-overlay{position:absolute;top:14px;left:14px;z-index:500;background:rgba(255,255,255,.94);
  backdrop-filter:blur(4px);padding:9px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-md);
  border:1px solid var(--grey-200);}
.map-title-overlay .mt1{font-size:12.5px;font-weight:800;color:var(--blue-800);letter-spacing:.02em;}
.map-title-overlay .mt2{font-size:10.5px;color:var(--grey-500);margin-top:1px;}
.map-title-overlay .mt-badge{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:9.5px;
  font-weight:700;color:var(--amber);background:var(--amber-bg);padding:2px 8px;border-radius:12px;letter-spacing:.04em;text-transform:uppercase;}

/* Legend (sec 13) */
.legend{position:absolute;bottom:22px;left:14px;z-index:500;background:rgba(255,255,255,.96);
  backdrop-filter:blur(4px);padding:12px 14px;border-radius:var(--r-md);box-shadow:var(--shadow-md);
  border:1px solid var(--grey-200);min-width:150px;}
.legend h4{font-size:10.5px;font-weight:800;color:var(--grey-500);text-transform:uppercase;
  letter-spacing:.06em;margin:0 0 9px;}
.legend-item{display:flex;align-items:center;gap:9px;padding:3px 0;font-size:12px;color:var(--grey-700);font-weight:500;}
.legend-item .lg-sw{width:15px;height:15px;border-radius:4px;flex-shrink:0;border:1.5px solid rgba(0,0,0,.1);}
.legend-item .lg-line{width:15px;height:0;border-top:3px solid;flex-shrink:0;}

/* Map buttons */
.map-btns{position:absolute;top:14px;right:14px;z-index:500;display:flex;flex-direction:column;gap:8px;}
.map-btn{width:40px;height:40px;background:#fff;border-radius:9px;box-shadow:var(--shadow-md);
  display:grid;place-items:center;color:var(--grey-700);border:1px solid var(--grey-200);transition:.13s;}
.map-btn:hover{background:var(--blue-050);color:var(--blue-700);}

/* Parcel hover tooltip (sec 14) */
.parcel-tip{background:var(--blue-900) !important;color:#fff !important;border:none !important;
  border-radius:8px !important;padding:0 !important;box-shadow:var(--shadow-lg) !important;font-family:var(--font);}
.parcel-tip::before{border-top-color:var(--blue-900) !important;}
.tip-inner{padding:9px 12px;min-width:150px;}
.tip-ulpin{font-family:var(--mono);font-size:12px;font-weight:700;color:#7fe9db;letter-spacing:.02em;}
.tip-row{display:flex;justify-content:space-between;gap:14px;font-size:11px;margin-top:4px;color:#cdddf2;}
.tip-row span:last-child{font-weight:600;color:#fff;}
.tip-status{margin-top:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;
  padding:2px 7px;border-radius:10px;display:inline-block;}

/* Parcel ID labels on map */
.parcel-label{background:transparent !important;border:none !important;box-shadow:none !important;}
.parcel-label .pl-inner{font-size:10px;font-weight:800;color:var(--blue-900);text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff,0 0 2px #fff;white-space:nowrap;}

/* ---------- RIGHT DRAWER (sec 15) ---------- */
.drawer{
  position:absolute;top:0;right:0;bottom:0;width:370px;background:#fff;z-index:1100;
  box-shadow:-8px 0 28px rgba(11,36,71,.14);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;
}
.drawer.open{transform:translateX(0);}
.drawer-head{background:linear-gradient(135deg,var(--blue-800),var(--blue-900));color:#fff;padding:16px 18px 18px;flex-shrink:0;position:relative;}
.drawer-head .d-eyebrow{font-size:10.5px;font-weight:700;color:#8fb4e6;text-transform:uppercase;letter-spacing:.08em;}
.drawer-head .d-pid{font-size:26px;font-weight:800;letter-spacing:.02em;margin-top:2px;display:flex;align-items:center;gap:11px;}
.drawer-head .d-close{position:absolute;top:14px;right:14px;color:#b9cbe6;font-size:20px;width:30px;height:30px;border-radius:7px;display:grid;place-items:center;transition:.13s;}
.drawer-head .d-close:hover{background:rgba(255,255,255,.12);color:#fff;}
.d-status-pill{font-size:11px;font-weight:700;padding:3px 10px;border-radius:14px;text-transform:uppercase;letter-spacing:.03em;}

/* ULPIN block (sec 16) */
.ulpin-block{background:rgba(255,255,255,.09);border:1.5px solid rgba(127,233,219,.4);border-radius:var(--r-md);
  padding:12px 14px;margin-top:14px;}
.ulpin-block .u-lab{font-size:10px;font-weight:700;color:#7fe9db;text-transform:uppercase;letter-spacing:.09em;display:flex;align-items:center;gap:6px;}
.ulpin-block .u-val{font-family:var(--mono);font-size:22px;font-weight:800;color:#fff;letter-spacing:.04em;margin-top:4px;}
.ulpin-block .u-cap{font-size:10.5px;color:#a9c6ea;margin-top:5px;}

.drawer-body{flex:1;overflow-y:auto;padding:16px 18px;}
.d-field-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--grey-200);border-radius:var(--r-md);overflow:hidden;border:1px solid var(--grey-200);}
.d-field{background:#fff;padding:10px 12px;}
.d-field .df-lab{font-size:10px;font-weight:700;color:var(--grey-500);text-transform:uppercase;letter-spacing:.05em;}
.d-field .df-val{font-size:14px;font-weight:700;color:var(--grey-900);margin-top:2px;}
.d-field.full{grid-column:1/-1;}

.risk-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:12px;}
.explore-btn{width:100%;margin-top:16px;background:linear-gradient(135deg,var(--blue-600),var(--blue-700));
  color:#fff;font-weight:700;font-size:14px;padding:13px;border-radius:var(--r-md);box-shadow:var(--shadow-md);
  display:flex;align-items:center;justify-content:center;gap:9px;transition:.15s;}
.explore-btn:hover{filter:brightness(1.08);box-shadow:var(--shadow-lg);transform:translateY(-1px);}

.mini-connect{margin-top:16px;}
.mini-connect .mc-title{font-size:11px;font-weight:800;color:var(--grey-500);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;text-align:center;}
.mc-flow{display:flex;flex-direction:column;align-items:center;gap:0;}
.mc-node{font-family:var(--mono);font-weight:800;font-size:13px;color:#fff;background:var(--blue-700);padding:6px 16px;border-radius:8px;box-shadow:var(--shadow-sm);}
.mc-node.ulpin{background:var(--teal-600);}
.mc-arrow{color:var(--grey-300);font-size:16px;line-height:1;margin:3px 0;}
.mc-datasets{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:3px;}
.mc-ds{font-size:10.5px;font-weight:600;color:var(--grey-700);background:var(--grey-100);padding:4px 9px;border-radius:12px;border:1px solid var(--grey-200);}

/* ---------- FULL PROFILE MODAL (sec 23-30) ---------- */
.profile-overlay{position:fixed;inset:0;background:rgba(11,36,71,.55);backdrop-filter:blur(3px);z-index:2000;
  display:none;align-items:flex-start;justify-content:center;padding:28px;overflow-y:auto;}
.profile-overlay.open{display:flex;}
.profile{background:var(--grey-050);border-radius:16px;box-shadow:var(--shadow-lg);width:100%;max-width:1140px;
  overflow:hidden;animation:profileIn .3s cubic-bezier(.34,1.3,.6,1);margin:auto;}
@keyframes profileIn{from{opacity:0;transform:translateY(24px) scale(.98);}to{opacity:1;transform:none;}}
.profile-head{background:linear-gradient(120deg,var(--blue-900),var(--blue-700));color:#fff;padding:22px 28px;position:relative;display:flex;align-items:center;gap:20px;flex-wrap:wrap;}
.profile-head .ph-eyebrow{font-size:11px;font-weight:700;color:#8fb4e6;text-transform:uppercase;letter-spacing:.1em;}
.profile-head h2{font-size:24px;font-weight:800;margin:2px 0 0;letter-spacing:.02em;}
.profile-head .ph-ulpin{font-family:var(--mono);font-size:15px;font-weight:700;color:#7fe9db;margin-top:3px;}
.profile-head .ph-close{margin-left:auto;color:#c7d8f0;font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px;
  background:rgba(255,255,255,.1);padding:9px 15px;border-radius:9px;transition:.14s;border:1px solid rgba(255,255,255,.15);}
.profile-head .ph-close:hover{background:rgba(255,255,255,.2);color:#fff;}
.profile-head .ph-badges{display:flex;gap:8px;flex-wrap:wrap;}
.profile-body{padding:24px 28px;max-height:calc(100vh - 190px);overflow-y:auto;}

.sec-title{font-size:13px;font-weight:800;color:var(--blue-800);text-transform:uppercase;letter-spacing:.05em;
  margin:0 0 14px;display:flex;align-items:center;gap:10px;}
.sec-title .st-num{width:22px;height:22px;border-radius:6px;background:var(--blue-700);color:#fff;font-size:11px;display:grid;place-items:center;font-weight:800;}
.sec-title .st-line{flex:1;height:1px;background:var(--grey-200);}
.block{margin-bottom:28px;}

/* Ecosystem diagram (sec 23,26,49) — THE central visual */
.ecosystem{background:linear-gradient(160deg,#0b2447,#123a6e);border-radius:14px;padding:28px 20px;position:relative;overflow:hidden;box-shadow:var(--shadow-md);}
.ecosystem::before{content:"";position:absolute;inset:0;background-image:radial-gradient(circle at 20% 20%,rgba(20,168,154,.14),transparent 42%),radial-gradient(circle at 80% 80%,rgba(59,111,191,.16),transparent 45%);}
.eco-title{position:relative;text-align:center;margin-bottom:22px;}
.eco-title .et1{font-size:22px;font-weight:800;color:#fff;letter-spacing:.03em;}
.eco-title .et1 em{color:#7fe9db;font-style:normal;}
.eco-title .et2{font-size:12px;color:#a9c6ea;margin-top:3px;letter-spacing:.03em;}
.eco-canvas{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;}
.eco-parcel{background:#fff;color:var(--blue-900);border-radius:11px;padding:11px 24px;text-align:center;box-shadow:var(--shadow-md);position:relative;z-index:2;}
.eco-parcel .ep-pid{font-size:19px;font-weight:800;letter-spacing:.02em;}
.eco-parcel .ep-ulpin{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--teal-700);margin-top:1px;}
.eco-connector{width:2px;height:22px;background:linear-gradient(#7fe9db,#3b6fbf);position:relative;z-index:1;}
.eco-ulpin{background:linear-gradient(135deg,var(--teal-500),var(--teal-700));color:#fff;border-radius:10px;padding:9px 22px;text-align:center;box-shadow:var(--shadow-md);position:relative;z-index:2;}
.eco-ulpin .eu-lab{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.85;}
.eco-ulpin .eu-val{font-family:var(--mono);font-size:14px;font-weight:800;letter-spacing:.03em;}
.eco-fan{position:relative;width:100%;margin-top:2px;}
.eco-datasets{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;margin-top:22px;position:relative;z-index:2;}
.eco-ds{background:rgba(255,255,255,.10);border:1.5px solid rgba(127,233,219,.35);border-radius:10px;
  padding:11px 14px;min-width:120px;text-align:center;backdrop-filter:blur(3px);transition:.2s;cursor:default;}
.eco-ds:hover{background:rgba(255,255,255,.18);transform:translateY(-3px);border-color:#7fe9db;}
.eco-ds .eds-ic{width:30px;height:30px;border-radius:8px;background:rgba(127,233,219,.18);display:grid;place-items:center;margin:0 auto 7px;color:#7fe9db;}
.eco-ds .eds-name{font-size:12px;font-weight:700;color:#fff;}
.eco-ds .eds-sub{font-size:9.5px;color:#9fc0e8;margin-top:2px;}
.eco-unified{margin-top:22px;position:relative;z-index:2;background:#fff;color:var(--blue-900);
  border-radius:11px;padding:13px 26px;text-align:center;box-shadow:var(--shadow-lg);}
.eco-unified .euf-lab{font-size:10px;font-weight:700;color:var(--teal-700);letter-spacing:.09em;text-transform:uppercase;}
.eco-unified .euf-val{font-size:17px;font-weight:800;letter-spacing:.02em;margin-top:1px;}
.eco-syn{position:absolute;top:14px;right:14px;font-size:9px;font-weight:700;color:#0b2447;background:#f4c667;padding:3px 9px;border-radius:11px;letter-spacing:.05em;text-transform:uppercase;z-index:3;}

/* Connected info cards (sec 24) */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;}
.info-card{background:#fff;border-radius:var(--r-md);padding:15px 16px;box-shadow:var(--shadow-sm);
  border:1px solid var(--grey-200);border-left:4px solid var(--blue-600);transition:.15s;}
.info-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);}
.info-card.warn{border-left-color:var(--amber);}
.info-card.conflict{border-left-color:var(--red);}
.info-card.ok{border-left-color:var(--green);}
.ic-head{display:flex;align-items:center;gap:9px;margin-bottom:11px;}
.ic-ic{width:32px;height:32px;border-radius:8px;background:var(--blue-050);color:var(--blue-700);display:grid;place-items:center;flex-shrink:0;}
.info-card.warn .ic-ic{background:var(--amber-bg);color:var(--amber);}
.info-card.conflict .ic-ic{background:var(--red-bg);color:var(--red);}
.info-card.ok .ic-ic{background:var(--green-bg);color:var(--green);}
.ic-title{font-size:12.5px;font-weight:800;color:var(--grey-900);text-transform:uppercase;letter-spacing:.03em;line-height:1.15;}
.ic-rows{display:flex;flex-direction:column;gap:6px;}
.ic-row{display:flex;justify-content:space-between;gap:10px;font-size:12px;}
.ic-row .icr-lab{color:var(--grey-500);font-weight:500;}
.ic-row .icr-val{color:var(--grey-900);font-weight:700;text-align:right;}
.data-tag{display:inline-flex;align-items:center;gap:5px;margin-top:11px;font-size:9.5px;font-weight:700;
  color:var(--amber);background:var(--amber-bg);padding:3px 9px;border-radius:11px;letter-spacing:.04em;text-transform:uppercase;}
.status-inline{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;}

/* Conflict alert (sec 29) */
.conflict-alert{background:linear-gradient(135deg,#fff,var(--amber-bg));border:1.5px solid #f0c27a;
  border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--shadow-sm);}
.ca-head{display:flex;align-items:center;gap:11px;margin-bottom:14px;}
.ca-ic{width:38px;height:38px;border-radius:9px;background:var(--amber);color:#fff;display:grid;place-items:center;flex-shrink:0;box-shadow:var(--shadow-sm);}
.ca-head .ca-t{font-size:14px;font-weight:800;color:#8a4d00;text-transform:uppercase;letter-spacing:.04em;}
.ca-head .ca-s{font-size:12px;color:var(--grey-600);}
.ca-compare{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px;}
.ca-source{background:#fff;border-radius:9px;padding:13px;text-align:center;border:1px solid var(--grey-200);}
.ca-source .cas-lab{font-size:10.5px;font-weight:700;color:var(--grey-500);text-transform:uppercase;letter-spacing:.05em;}
.ca-source .cas-val{font-size:22px;font-weight:800;color:var(--grey-900);margin-top:4px;}
.ca-source .cas-unit{font-size:11px;color:var(--grey-500);font-weight:600;}
.ca-source.flag{border-color:var(--amber);background:var(--amber-bg);}
.ca-source.flag .cas-val{color:var(--amber);}
.ca-verdict{display:flex;align-items:center;gap:10px;background:#fff;border-radius:9px;padding:11px 14px;border:1px dashed var(--amber);}
.ca-verdict .cav-badge{font-size:10.5px;font-weight:800;color:#fff;background:var(--amber);padding:4px 11px;border-radius:12px;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0;}
.ca-verdict .cav-text{font-size:12.5px;color:var(--grey-700);font-weight:600;}

/* Timeline (sec 28) */
.timeline{position:relative;padding-left:8px;}
.tl-line{position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:var(--grey-200);}
.tl-item{position:relative;padding:0 0 18px 34px;}
.tl-item:last-child{padding-bottom:0;}
.tl-dot{position:absolute;left:8px;top:2px;width:16px;height:16px;border-radius:50%;background:#fff;
  border:3px solid var(--blue-600);z-index:2;}
.tl-item.current .tl-dot{border-color:var(--teal-600);background:var(--teal-600);box-shadow:0 0 0 4px var(--teal-050);}
.tl-year{font-size:12px;font-weight:800;color:var(--blue-700);font-family:var(--mono);}
.tl-item.current .tl-year{color:var(--teal-700);}
.tl-event{font-size:13px;font-weight:600;color:var(--grey-800);margin-top:1px;}

/* Officer/Citizen conditional (sec 31) */
.role-only-officer{display:none;}
body.role-officer .role-only-officer{display:block;}
body.role-officer .role-only-citizen-hide{display:none;}
.role-note{font-size:11.5px;color:var(--grey-500);background:var(--grey-100);border-radius:8px;padding:9px 13px;
  display:flex;align-items:center;gap:9px;margin-bottom:16px;border:1px solid var(--grey-200);}
.role-note .rn-ic{color:var(--blue-600);flex-shrink:0;}

/* Architecture visual (sec 35) */
.arch-visual{background:#fff;border-radius:var(--r-md);padding:22px;box-shadow:var(--shadow-sm);border:1px solid var(--grey-200);}
.arch-future-tag{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;color:var(--blue-700);
  background:var(--blue-050);padding:4px 11px;border-radius:12px;letter-spacing:.05em;text-transform:uppercase;margin-bottom:16px;}
.arch-layer{background:var(--grey-050);border:1.5px solid var(--grey-200);border-radius:10px;padding:12px 16px;text-align:center;position:relative;}
.arch-layer .al-lab{font-size:10px;font-weight:800;color:var(--grey-500);text-transform:uppercase;letter-spacing:.06em;}
.arch-depts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:8px;}
.arch-dept{font-size:11px;font-weight:600;color:var(--grey-700);background:#fff;padding:5px 12px;border-radius:8px;border:1px solid var(--grey-200);}
.arch-layer.highlight{background:linear-gradient(135deg,var(--teal-050),#fff);border-color:var(--teal-500);}
.arch-layer.highlight .al-lab{color:var(--teal-700);}
.arch-layer.blue{background:linear-gradient(135deg,var(--blue-050),#fff);border-color:var(--blue-500);}
.arch-layer.blue .al-lab{color:var(--blue-700);}
.arch-layer .al-main{font-size:14px;font-weight:800;color:var(--grey-900);margin-top:3px;}
.arch-arrow{text-align:center;color:var(--grey-300);font-size:20px;line-height:1;padding:4px 0;}

/* Future vs Current (sec 36) */
.fvc-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.fvc-col{background:#fff;border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-sm);border:1px solid var(--grey-200);}
.fvc-col.current{border-top:4px solid var(--green);}
.fvc-col.future{border-top:4px solid var(--grey-400);}
.fvc-col h4{font-size:13px;font-weight:800;margin:0 0 13px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;gap:8px;}
.fvc-col.current h4{color:var(--green);}
.fvc-col.future h4{color:var(--grey-500);}
.fvc-list{display:flex;flex-direction:column;gap:8px;}
.fvc-row{display:flex;align-items:center;gap:9px;font-size:12.5px;}
.fvc-row .fvc-mk{width:18px;height:18px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;font-size:11px;font-weight:800;}
.fvc-col.current .fvc-mk{background:var(--green-bg);color:var(--green);}
.fvc-col.future .fvc-mk{background:var(--grey-100);color:var(--grey-400);}
.fvc-row .fvc-tx{color:var(--grey-700);font-weight:500;}
.fvc-col.future .fvc-tx{color:var(--grey-500);}

/* ---------- SIH DEMO MODE (sec 32,33) ---------- */
.sih-overlay{position:fixed;inset:0;z-index:1900;pointer-events:none;display:none;}
.sih-overlay.active{display:block;}
.sih-panel{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:1950;
  background:linear-gradient(135deg,var(--blue-900),var(--blue-800));color:#fff;border-radius:14px;
  box-shadow:var(--shadow-lg);padding:0;width:min(680px,calc(100vw - 40px));pointer-events:auto;
  border:1px solid rgba(127,233,219,.3);display:none;animation:sihIn .3s ease;}
.sih-panel.open{display:block;}
@keyframes sihIn{from{opacity:0;transform:translateX(-50%) translateY(20px);}to{opacity:1;transform:translateX(-50%) translateY(0);}}
.sih-top{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid rgba(255,255,255,.12);}
.sih-top .st-ic{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--teal-500),var(--teal-700));display:grid;place-items:center;flex-shrink:0;}
.sih-top .st-txt .st-t{font-size:14px;font-weight:800;letter-spacing:.02em;}
.sih-top .st-txt .st-s{font-size:11px;color:#9fc0e8;}
.sih-top .st-close{margin-left:auto;color:#b9cbe6;font-size:13px;font-weight:600;background:rgba(255,255,255,.1);padding:7px 12px;border-radius:8px;transition:.13s;}
.sih-top .st-close:hover{background:rgba(255,255,255,.2);color:#fff;}
.sih-steps{display:flex;gap:6px;padding:14px 18px 6px;}
.sih-step-dot{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.16);transition:.3s;}
.sih-step-dot.done{background:var(--teal-500);}
.sih-step-dot.active{background:#7fe9db;box-shadow:0 0 8px rgba(127,233,219,.6);}
.sih-narrate{padding:6px 18px 14px;}
.sih-narrate .sn-step{font-size:10.5px;font-weight:700;color:#7fe9db;letter-spacing:.08em;text-transform:uppercase;}
.sih-narrate .sn-text{font-size:14px;font-weight:600;color:#fff;margin-top:3px;line-height:1.4;}
.sih-controls{display:flex;align-items:center;gap:10px;padding:0 18px 16px;flex-wrap:wrap;}
.sih-scenarios{display:flex;gap:7px;flex-wrap:wrap;flex:1;}
.sih-scen-btn{font-size:11px;font-weight:700;padding:7px 12px;border-radius:8px;background:rgba(255,255,255,.1);
  color:#cddef2;border:1px solid rgba(255,255,255,.14);transition:.13s;white-space:nowrap;}
.sih-scen-btn:hover{background:rgba(127,233,219,.2);color:#fff;border-color:#7fe9db;}
.sih-nav{display:flex;gap:8px;}
.sih-nav button{font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:9px;transition:.13s;}
.sih-prev{background:rgba(255,255,255,.1);color:#cddef2;}
.sih-prev:hover{background:rgba(255,255,255,.18);color:#fff;}
.sih-next{background:linear-gradient(135deg,var(--teal-500),var(--teal-700));color:#fff;box-shadow:var(--shadow-sm);}
.sih-next:hover{filter:brightness(1.1);}
.sih-auto{background:rgba(255,255,255,.1);color:#cddef2;width:38px;padding:8px 0;display:grid;place-items:center;}
.sih-auto.on{background:var(--teal-600);color:#fff;}

/* spotlight highlight for demo */
.sih-spotlight{position:fixed;z-index:1940;pointer-events:none;border-radius:12px;
  box-shadow:0 0 0 4px #7fe9db,0 0 0 9999px rgba(11,36,71,.45);transition:.35s cubic-bezier(.4,0,.2,1);display:none;}
.sih-spotlight.show{display:block;}

/* ---------- FOOTER (sec 42,43) ---------- */
.footer{background:var(--blue-900);color:#9fc0e8;flex-shrink:0;font-size:11px;padding:8px 18px;
  display:flex;align-items:center;gap:20px;flex-wrap:wrap;z-index:700;box-shadow:0 -1px 4px rgba(0,0,0,.1);}
.footer .f-brand{font-weight:800;color:#fff;letter-spacing:.02em;}
.footer .f-badge{display:flex;align-items:center;gap:6px;}
.footer .f-badge .fb-lab{color:#6d8cb8;font-weight:600;}
.footer .f-badge .fb-val{font-weight:700;padding:1px 8px;border-radius:10px;font-size:10px;letter-spacing:.03em;}
.footer .fb-val.demo{background:var(--amber-bg);color:var(--amber);}
.footer .fb-val.syn{background:var(--teal-050);color:var(--teal-700);}
.footer .fb-val.sim{background:var(--blue-050);color:var(--blue-700);}
.footer .f-notice{margin-left:auto;font-style:italic;max-width:440px;text-align:right;line-height:1.3;color:#7d9bc4;}

/* Legal disclaimer modal (sec 43) */
.legal-link{color:#7fb0ea;text-decoration:underline;cursor:pointer;font-style:normal;font-weight:600;}
.legal-modal{position:fixed;inset:0;background:rgba(11,36,71,.6);z-index:2100;display:none;align-items:center;justify-content:center;padding:24px;}
.legal-modal.open{display:flex;}
.legal-box{background:#fff;border-radius:14px;max-width:560px;box-shadow:var(--shadow-lg);overflow:hidden;animation:profileIn .3s ease;}
.legal-box .lb-head{background:var(--blue-900);color:#fff;padding:18px 22px;display:flex;align-items:center;gap:12px;}
.legal-box .lb-head .lbh-ic{width:36px;height:36px;border-radius:9px;background:var(--amber);display:grid;place-items:center;flex-shrink:0;}
.legal-box .lb-head h3{margin:0;font-size:16px;font-weight:800;}
.legal-box .lb-body{padding:22px;font-size:13.5px;line-height:1.65;color:var(--grey-700);}
.legal-box .lb-body strong{color:var(--grey-900);}
.legal-box .lb-close{width:100%;background:var(--blue-700);color:#fff;font-weight:700;padding:12px;font-size:14px;}
.legal-box .lb-close:hover{background:var(--blue-800);}

/* toast */
.toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);z-index:2200;
  background:var(--blue-900);color:#fff;padding:11px 20px;border-radius:11px;box-shadow:var(--shadow-lg);
  font-size:13px;font-weight:600;opacity:0;transition:.25s;pointer-events:none;display:flex;align-items:center;gap:9px;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.toast .tt-ic{color:#7fe9db;}

/* scrollbars */
::-webkit-scrollbar{width:9px;height:9px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--grey-300);border-radius:6px;border:2px solid transparent;background-clip:padding-box;}
::-webkit-scrollbar-thumb:hover{background:var(--grey-400);background-clip:padding-box;}

/* ---------- RESPONSIVE (sec 41) ---------- */
@media(max-width:1080px){
  .kpi-tagline{display:none;}
  .header-search{max-width:340px;}
}
@media(max-width:900px){
  body{overflow:auto;}
  .left-panel{position:absolute;left:0;top:0;bottom:0;transform:translateX(-100%);transition:transform .25s;}
  .left-panel.mobile-open{transform:translateX(0);}
  .drawer{width:100%;top:auto;bottom:0;height:62%;transform:translateY(100%);box-shadow:0 -8px 28px rgba(11,36,71,.2);}
  .drawer.open{transform:translateY(0);}
  .header-controls .seg.role-seg{display:none;}
  .brand .titles .sub{display:none;}
  .fvc-grid{grid-template-columns:1fr;}
  .ca-compare{grid-template-columns:1fr;}
}
@media(max-width:640px){
  .header{flex-wrap:wrap;height:auto;padding:10px 12px;gap:10px;}
  .header-search{order:3;max-width:none;width:100%;}
  .header-controls{margin-left:0;}
  .profile-body{padding:16px;}
  .profile-overlay{padding:0;}
  .profile{border-radius:0;min-height:100vh;}
}
.mobile-menu-btn{display:none;}
@media(max-width:900px){.mobile-menu-btn{display:grid;place-items:center;width:38px;height:38px;background:rgba(255,255,255,.1);border-radius:9px;color:#fff;}}

/* ============================================================
   EXTENSION COMPONENTS
   ============================================================ */
/* legend dots */
.lg-dot{width:12px;height:12px;border-radius:50%;display:inline-block;flex-shrink:0;}
/* map zone + infra labels */
.zl-inner{font-size:10px;font-weight:800;padding:2px 7px;border-radius:5px;white-space:nowrap;
  background:rgba(124,58,237,.12);color:#6d28d9;border:1px solid rgba(124,58,237,.4);}
.infra-pin{pointer-events:none;}
.infra-pin .ip-dot{width:10px;height:10px;border-radius:50%;background:var(--teal-600);border:2px solid #fff;box-shadow:var(--shadow-sm);}
.infra-pin .ip-lab{position:absolute;left:12px;top:-3px;font-size:9px;font-weight:700;color:var(--teal-700);
  background:rgba(255,255,255,.9);padding:1px 5px;border-radius:4px;white-space:nowrap;}
/* drawer three-category chips */
.mc-cats{display:flex;flex-direction:column;gap:6px;width:100%;}
.mc-cat{font-size:11px;font-weight:700;padding:7px 10px;border-radius:8px;text-align:center;border:1.5px solid;}
.mc-cat.base{color:var(--blue-700);background:var(--blue-050);border-color:#c7d7ef;}
.mc-cat.gov{color:var(--teal-700);background:var(--teal-050);border-color:#bfe4df;}
.mc-cat.svc{color:var(--amber);background:var(--amber-bg);border-color:#f2d9b3;}

/* generic kv-table */
.kv-table{display:flex;flex-direction:column;gap:0;}
.kv-row{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed var(--grey-200);font-size:12.5px;}
.kv-row:last-child{border-bottom:none;}
.kv-k{color:var(--grey-500);font-weight:600;}
.kv-v{color:var(--grey-900);font-weight:600;text-align:right;}
.val-ok{color:var(--green);font-weight:800;}
.val-warn{color:var(--amber);font-weight:800;}

/* section-number category colors */
.st-num.base{background:var(--blue-600)!important;}
.st-num.gov{background:var(--teal-600)!important;}
.st-num.svc{background:var(--amber)!important;}
.demo-chip{font-size:9px;font-weight:800;letter-spacing:.05em;padding:2px 7px;border-radius:10px;
  background:var(--amber-bg);color:var(--amber);margin-left:8px;}
.demo-inline{font-size:11px;color:var(--grey-500);font-style:italic;margin-top:9px;}
.future-chip{display:inline-block;font-size:9px;font-weight:800;padding:2px 7px;border-radius:10px;
  background:#f3e8ff;color:#7c3aed;margin-right:8px;}

/* base-spatial triple grid */
.triple-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.tg-card{background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);padding:15px 16px;box-shadow:var(--shadow-sm);}
.tgc-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--blue-800);
  text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.tgc-h svg{color:var(--blue-600);}

/* unified three-category view */
.unified{background:linear-gradient(180deg,#fbfdff,#f3f7fd);border:1px solid var(--grey-200);
  border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);}
.uni-top{display:flex;justify-content:center;margin-bottom:16px;}
.uni-ulpin{text-align:center;background:var(--blue-900);color:#fff;border-radius:var(--r-md);padding:12px 26px;box-shadow:var(--shadow-md);}
.uu-lab{font-size:9.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;opacity:.75;}
.uu-val{font-size:20px;font-weight:800;font-family:var(--mono);letter-spacing:.04em;margin:2px 0;}
.uu-sub{font-size:11px;opacity:.8;}
.uni-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;position:relative;}
.uni-cat{background:#fff;border:1px solid var(--grey-200);border-top:3px solid;border-radius:var(--r-md);padding:14px 15px;}
.uni-cat.base{border-top-color:var(--blue-600);}
.uni-cat.gov{border-top-color:var(--teal-600);}
.uni-cat.svc{border-top-color:var(--amber);}
.uc-h{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--grey-900);}
.uc-n{width:20px;height:20px;border-radius:6px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;}
.uni-cat.base .uc-n{background:var(--blue-600);}
.uni-cat.gov .uc-n{background:var(--teal-600);}
.uni-cat.svc .uc-n{background:var(--amber);}
.uc-sub{font-size:11px;color:var(--grey-500);margin:3px 0 9px;}
.uni-cat ul{margin:0;padding-left:16px;}
.uni-cat li{font-size:12px;color:var(--grey-700);margin-bottom:4px;}
.uni-result{margin-top:16px;text-align:center;font-size:13px;font-weight:700;color:var(--teal-700);
  display:flex;align-items:center;justify-content:center;gap:7px;}
.uni-result svg{color:var(--teal-600);}

/* spatial alerts */
.spatial-alerts{display:flex;flex-direction:column;gap:8px;}
.sp-alert{display:flex;align-items:center;gap:9px;background:var(--amber-bg);border:1px solid #f2d9b3;
  border-left:4px solid var(--amber);border-radius:var(--r-sm);padding:10px 13px;font-size:12.5px;font-weight:600;color:#92400e;}
.sp-alert svg{color:var(--amber);flex-shrink:0;}

/* record consistency */
.cons-list{display:flex;flex-direction:column;gap:8px;}
.cons-row{display:grid;grid-template-columns:22px 1fr 1.3fr;align-items:center;gap:10px;background:#fff;
  border:1px solid var(--grey-200);border-radius:var(--r-sm);padding:10px 13px;font-size:12.5px;}
.cons-row.ok{border-left:4px solid var(--green);} .cons-row.ok .cons-ic{color:var(--green);}
.cons-row.warn{border-left:4px solid var(--amber);} .cons-row.warn .cons-ic{color:var(--amber);}
.cons-row.conflict{border-left:4px solid var(--red);} .cons-row.conflict .cons-ic{color:var(--red);}
.cons-rule{font-weight:700;color:var(--grey-700);}
.cons-res{color:var(--grey-900);font-weight:600;}

/* interoperability + data quality */
.io-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;}
.io-quality,.io-systems{background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);padding:15px 16px;box-shadow:var(--shadow-sm);}
.ioq-title{font-size:12px;font-weight:800;color:var(--grey-700);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.io-sys-list{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.io-sys{display:flex;align-items:center;gap:7px;padding:8px 10px;border-radius:var(--r-sm);border:1px solid var(--grey-200);
  background:var(--grey-050);text-align:left;transition:.13s;}
.io-sys:hover{border-color:var(--blue-500);background:var(--blue-050);}
.io-sys.sel{border-color:var(--blue-600);background:var(--blue-050);box-shadow:0 0 0 2px rgba(36,86,166,.15);}
.ios-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.io-sys.conn .ios-dot{background:var(--green);} .io-sys.mock .ios-dot{background:var(--grey-400);}
.ios-name{font-size:12px;font-weight:700;color:var(--grey-800);flex:1;}
.ios-state{font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;}
.io-sys.conn .ios-state{color:var(--green);} .io-sys.mock .ios-state{color:var(--grey-500);}
.io-detail{font-size:12px;color:var(--grey-700);background:var(--grey-050);border:1px dashed var(--grey-300);
  border-radius:var(--r-sm);padding:11px 13px;line-height:1.6;}
.io-badge{font-size:9px;font-weight:800;padding:1px 6px;border-radius:8px;text-transform:uppercase;}
.io-badge.conn{background:var(--green-bg);color:var(--green);} .io-badge.mock{background:var(--grey-100);color:var(--grey-500);}

/* canonical model + normalization + lineage */
.canon-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:16px;}
.canon-box{background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);padding:15px 16px;box-shadow:var(--shadow-sm);}
.cb-title{font-size:12px;font-weight:800;color:var(--grey-700);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px;}
.canon-json{font-family:var(--mono);font-size:11.5px;background:var(--blue-900);color:#dbe7fb;border-radius:var(--r-sm);padding:12px 13px;}
.cj-row{display:flex;justify-content:space-between;gap:10px;padding:1px 0;}
.cj-k{color:#8fb4e8;} .cj-v{color:#eaf1fc;font-weight:600;}
.cj-nest{margin-top:7px;color:#a7c4ec;font-size:10.5px;border-top:1px solid rgba(255,255,255,.12);padding-top:6px;}
.norm-list{display:flex;flex-direction:column;gap:9px;}
.norm-row{display:grid;grid-template-columns:1fr 20px 1.3fr;align-items:center;gap:8px;}
.nr-src,.nr-canon{display:flex;flex-direction:column;gap:3px;}
.nr-src code,.nr-canon code{font-family:var(--mono);font-size:11px;background:var(--grey-100);padding:3px 7px;border-radius:5px;color:var(--grey-800);}
.nr-canon code{background:var(--teal-050);color:var(--teal-700);}
.nr-tag{font-size:9px;font-weight:800;color:var(--grey-500);text-transform:uppercase;}
.nr-arrow{text-align:center;color:var(--teal-600);font-weight:800;}
.nr-val{font-size:11px;color:var(--grey-600);font-weight:600;}

/* documents */
.doc-list{display:flex;flex-wrap:wrap;gap:9px;}
.doc-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--grey-200);
  border-radius:20px;padding:7px 13px;box-shadow:var(--shadow-sm);}
.doc-chip svg{color:var(--blue-600);}
.dc-name{font-size:12px;font-weight:700;color:var(--grey-800);}
.dc-ref{font-size:11px;font-family:var(--mono);color:var(--grey-500);}

/* change detection + audit mini grid */
.mini2-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.mini2-card{background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);padding:15px 16px;box-shadow:var(--shadow-sm);}
.m2-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--blue-800);margin-bottom:9px;}
.m2-h svg{color:var(--blue-600);}
.m2-b{font-size:12.5px;color:var(--grey-700);}

/* architecture branch */
.arch-branch{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;}
.ab-col{border-radius:var(--r-md);padding:12px 13px;border:1px solid;text-align:center;}
.ab-col.base{background:var(--blue-050);border-color:#c7d7ef;}
.ab-col.gov{background:var(--teal-050);border-color:#bfe4df;}
.ab-col.svc{background:var(--amber-bg);border-color:#f2d9b3;}
.abc-h{font-size:12px;font-weight:800;margin-bottom:5px;}
.ab-col.base .abc-h{color:var(--blue-700);}
.ab-col.gov .abc-h{color:var(--teal-700);}
.ab-col.svc .abc-h{color:var(--amber);}
.abc-b{font-size:11px;color:var(--grey-600);line-height:1.5;}
.arch-layer.teal{background:var(--teal-700);color:#fff;}
.arch-layer.teal .al-lab{color:rgba(255,255,255,.8);} .arch-layer.teal .al-main{color:#fff;}

/* scale across india */
.scale-visual{background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow-sm);text-align:center;}
.scale-root{display:inline-block;background:var(--blue-900);color:#fff;font-weight:800;font-size:13px;padding:9px 20px;border-radius:var(--r-md);}
.scale-tree{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin:16px 0;}
.scale-node{background:var(--grey-050);border:1px solid var(--grey-200);border-radius:var(--r-md);padding:11px 15px;min-width:110px;font-size:12px;color:var(--grey-700);}
.scale-node b{color:var(--grey-900);}
.scale-node.active{background:var(--teal-050);border-color:#bfe4df;}
.scale-node.active b{color:var(--teal-700);}
.scale-node.dim{opacity:.5;}
.sn-kids{display:flex;flex-direction:column;gap:4px;margin-top:7px;}
.sn-kids span{font-size:10.5px;background:#fff;border:1px solid var(--grey-200);border-radius:12px;padding:2px 8px;color:var(--grey-600);}
.scale-foot{font-size:12px;font-weight:700;color:var(--teal-700);display:flex;align-items:center;justify-content:center;gap:7px;}
.scale-foot svg{color:var(--teal-600);}

/* responsive tweaks for new grids */
@media(max-width:900px){
  .triple-grid,.uni-cats,.io-grid,.canon-grid,.mini2-grid,.arch-branch{grid-template-columns:1fr;}
  .io-sys-list{grid-template-columns:1fr 1fr;}
}

/* ============================================================
   LIVE API CONSOLE + MODE SELECTOR (Live API Architecture)
   ============================================================ */
.mode-seg button{display:flex;align-items:center;}
.mode-seg button.on[data-mode="live"]{background:var(--teal-700);color:#fff;}
.btn-api{position:relative;display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:var(--blue-800);background:var(--blue-050);border:1px solid #c7d7ef;border-radius:20px;padding:6px 13px;transition:.13s;}
.btn-api:hover{background:#e2ecfb;}
.btn-api .api-dot{width:8px;height:8px;border-radius:50%;background:var(--grey-400);}
.btn-api .api-dot.on{background:var(--green);box-shadow:0 0 0 3px rgba(22,163,74,.2);}
.mode-pill{margin-left:12px;font-size:10px;font-weight:800;letter-spacing:.05em;padding:2px 9px;border-radius:11px;}
.mode-pill.demo{background:rgba(255,255,255,.25);color:#fff;}
.mode-pill.live{background:#fff;color:var(--teal-700);}
.mode-pill.live.on{background:var(--green);color:#fff;}

.api-overlay{position:fixed;inset:0;z-index:5000;background:rgba(11,36,71,.55);backdrop-filter:blur(3px);
  display:none;align-items:flex-start;justify-content:center;padding:34px 20px;overflow-y:auto;}
.api-overlay.open{display:flex;}
.api-console{background:var(--grey-050);width:min(880px,100%);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);overflow:hidden;}
.api-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:20px 24px;
  background:linear-gradient(120deg,var(--blue-900),var(--blue-700));color:#fff;}
.api-head h2{margin:3px 0;font-size:20px;font-weight:800;}
.ah-eyebrow{font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;opacity:.75;}
.ah-sub{font-size:12px;opacity:.85;}
.api-body{padding:20px 24px;}
.api-card{background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);padding:18px 20px;box-shadow:var(--shadow-sm);}
.api-card.ok{border-left:4px solid var(--green);}
.apc-head{font-size:12px;font-weight:800;letter-spacing:.06em;color:var(--grey-700);text-transform:uppercase;margin-bottom:13px;
  display:flex;align-items:center;gap:10px;}
.off-chip{font-size:9px;font-weight:800;background:var(--amber-bg);color:var(--amber);padding:2px 8px;border-radius:10px;letter-spacing:.04em;}
.apc-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 18px;margin-bottom:14px;}
.apc-grid>div{display:flex;flex-direction:column;gap:1px;}
.apc-k{font-size:10px;font-weight:700;color:var(--grey-500);text-transform:uppercase;letter-spacing:.04em;}
.apc-v{font-size:13px;font-weight:700;color:var(--grey-900);}
.apc-v.mono{font-family:var(--mono);font-size:11.5px;}
.st-conn{color:var(--green);} .st-idle{color:var(--grey-500);}
.api-check{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
.ac-row{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--grey-400);}
.ac-row svg{color:var(--grey-300);}
.ac-row.ok{color:var(--green);} .ac-row.ok svg{color:var(--green);}
.apc-foot{font-size:11.5px;color:var(--grey-500);display:flex;align-items:center;gap:6px;}
.apc-foot .api-alt{margin-left:auto;padding:6px 12px;}
.apc-foot svg{color:var(--green);}
.api-run{margin-top:4px;display:inline-flex;align-items:center;gap:8px;background:var(--teal-700);color:#fff;
  font-size:13px;font-weight:800;padding:10px 20px;border-radius:var(--r-sm);transition:.13s;}
.api-run:hover{background:var(--teal-600);}
.api-alt{display:inline-flex;align-items:center;gap:6px;background:var(--grey-100);color:var(--grey-700);
  font-size:12px;font-weight:700;padding:9px 15px;border-radius:var(--r-sm);margin-left:8px;transition:.13s;}
.api-alt:hover{background:var(--grey-200);}
.api-note{font-size:11.5px;color:var(--grey-600);background:var(--blue-050);border:1px dashed #c7d7ef;
  border-radius:var(--r-sm);padding:10px 13px;margin-top:14px;display:flex;gap:8px;align-items:flex-start;line-height:1.55;}
.api-note svg{color:var(--blue-600);flex-shrink:0;margin-top:1px;}

/* source badges */
.src-badge{display:inline-flex;align-items:center;gap:6px;font-size:10px;font-weight:800;letter-spacing:.03em;
  padding:3px 10px;border-radius:11px;text-transform:uppercase;}
.src-badge .sb-dot{width:7px;height:7px;border-radius:50%;}
.ba-live{background:var(--green-bg);color:var(--green);} .ba-live .sb-dot{background:var(--green);}
.ba-syn{background:var(--blue-050);color:var(--blue-700);} .ba-syn .sb-dot{background:var(--blue-600);}
.ba-future{background:var(--grey-100);color:var(--grey-500);} .ba-future .sb-dot{background:var(--grey-400);border:1px solid var(--grey-500);}

/* data sources panel */
.ds-panel{background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);padding:15px 18px;margin-top:16px;box-shadow:var(--shadow-sm);}
.ds-cat{font-size:10px;font-weight:800;color:var(--grey-400);text-transform:uppercase;letter-spacing:.07em;margin:12px 0 6px;}
.ds-cat:first-child{margin-top:0;}
.ds-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px dashed var(--grey-200);font-size:12.5px;font-weight:600;color:var(--grey-700);}
.ds-row:last-child{border-bottom:none;}

/* loading */
.api-loading{display:flex;flex-direction:column;align-items:center;gap:18px;padding:50px 0;}
.spinner{width:44px;height:44px;border:4px solid var(--grey-200);border-top-color:var(--teal-600);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.al-lines{text-align:center;font-size:13px;color:var(--grey-600);display:flex;flex-direction:column;gap:5px;}
.al-lines div:nth-child(1){animation:fade 1.5s infinite;}
.al-lines div:nth-child(2){animation:fade 1.5s .4s infinite;}
.al-lines div:nth-child(3){animation:fade 1.5s .8s infinite;}
@keyframes fade{0%,100%{opacity:.4;}50%{opacity:1;}}

/* states */
.api-state{text-align:center;padding:34px 20px;background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);box-shadow:var(--shadow-sm);}
.api-state.err .as-ic{color:var(--red);} .api-state .as-ic{color:var(--blue-600);margin-bottom:8px;}
.as-t{font-size:16px;font-weight:800;color:var(--grey-900);}
.as-s{font-size:12px;color:var(--grey-500);margin-top:5px;font-family:var(--mono);}
.as-btns{margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.as-btns .api-alt{margin-left:0;}

/* tabs */
.api-tabs{display:flex;gap:6px;margin:16px 0 0;flex-wrap:wrap;}
.api-tab{font-size:12px;font-weight:700;padding:8px 14px;border-radius:var(--r-sm) var(--r-sm) 0 0;background:var(--grey-100);color:var(--grey-600);}
.api-tab.on{background:var(--blue-900);color:#fff;}
.api-tab-body{background:#fff;border:1px solid var(--grey-200);border-radius:0 var(--r-md) var(--r-md) var(--r-md);padding:16px;}
.api-raw{margin:0;font-family:var(--mono);font-size:11px;line-height:1.5;background:var(--blue-900);color:#dbe7fb;
  padding:14px;border-radius:var(--r-sm);max-height:340px;overflow:auto;white-space:pre;}
.canon-flow{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.cf-h{font-size:11px;font-weight:800;color:var(--grey-600);text-transform:uppercase;letter-spacing:.04em;margin-bottom:9px;}
.cf-row{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-size:12px;}
.cf-row code{font-family:var(--mono);background:var(--grey-100);padding:3px 8px;border-radius:5px;color:var(--grey-800);}
.cf-row .cf-c{background:var(--teal-050);color:var(--teal-700);}
.cf-row span{color:var(--teal-600);font-weight:800;}

/* api data dashboard */
.api-dash .ad-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:6px;}
.api-dash .ad-head span{font-size:11px;color:var(--grey-500);}
.ad-meta{font-size:12px;color:var(--grey-600);margin-bottom:12px;}
.api-table{width:100%;border-collapse:collapse;font-size:12.5px;}
.api-table th{text-align:left;background:var(--grey-100);color:var(--grey-600);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;padding:8px 10px;}
.api-table td{padding:7px 10px;border-bottom:1px solid var(--grey-100);color:var(--grey-800);}
.api-empty-mini{font-size:12px;color:var(--grey-500);padding:10px;}

/* profile provenance strip */
.prov-strip{display:flex;flex-wrap:wrap;align-items:center;gap:10px;background:#fff;border:1px solid var(--grey-200);
  border-radius:var(--r-md);padding:12px 15px;box-shadow:var(--shadow-sm);margin-bottom:4px;}
.prov-strip .ps-lab{font-size:11px;font-weight:800;color:var(--grey-500);text-transform:uppercase;letter-spacing:.05em;}
.prov-item{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:600;color:var(--grey-700);}

@media(max-width:900px){ .apc-grid,.api-check,.canon-flow{grid-template-columns:1fr;} }
@media(max-width:720px){ .mode-seg svg,.btn-api span{display:none;} }

/* ============================================================
   ACCESS GATE / CHATBOT / AI ANALYTICS (part 5)
   ============================================================ */
/* language dropdown + AI button in header */
.lang-sel{font-size:12px;font-weight:600;color:var(--grey-800);background:#fff;border:1px solid var(--grey-300);
  border-radius:var(--r-sm);padding:6px 8px;max-width:120px;cursor:pointer;}
.lang-sel:hover{border-color:var(--blue-500);}
.kpi-tagline{margin-left:auto;display:flex;align-items:center;padding:0 18px;}
.kpi-ai-btn{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:800;color:#fff;
  background:linear-gradient(120deg,#4c1d95,#7c3aed);border-radius:20px;padding:8px 16px;box-shadow:var(--shadow-sm);transition:.13s;}
.kpi-ai-btn:hover{filter:brightness(1.08);}
/* AI layer category color */
.layer-cat.ai{color:#7c3aed;}
.layer-cat.ai .lc-num{background:#7c3aed;font-size:9px;}
.ai-change-pin .acp{color:#dc2626;font-size:13px;line-height:1;text-shadow:0 0 3px #fff,0 0 3px #fff;}

/* ---------- LANDING GATE ---------- */
.landing{position:fixed;inset:0;z-index:9000;background:linear-gradient(140deg,var(--blue-900),var(--blue-700) 55%,var(--teal-700));
  display:flex;align-items:center;justify-content:center;padding:24px;transition:opacity .4s,visibility .4s;}
.landing.done{opacity:0;visibility:hidden;pointer-events:none;}
.ld-box{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);max-width:640px;width:100%;
  padding:34px 34px 26px;text-align:center;}
.ld-seal{width:60px;height:60px;border-radius:50%;background:var(--blue-800);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;}
.ld-title{font-size:26px;font-weight:800;letter-spacing:.06em;color:var(--blue-900);}
.ld-sub{font-size:13px;color:var(--grey-500);margin-top:4px;}
.ld-prompt{display:inline-flex;align-items:center;gap:7px;margin:20px 0 14px;font-size:12px;font-weight:700;
  color:var(--grey-600);background:var(--grey-100);padding:7px 14px;border-radius:20px;}
.ld-prompt svg{color:var(--blue-600);}
.ld-roles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;}
.ld-role{text-align:left;background:#fff;border:1.5px solid var(--grey-200);border-radius:var(--r-md);padding:18px;
  transition:.15s;position:relative;}
.ld-role:hover{border-color:var(--teal-500);box-shadow:var(--shadow-md);transform:translateY(-2px);}
.lr-ic{width:46px;height:46px;border-radius:12px;background:var(--teal-050);color:var(--teal-700);
  display:flex;align-items:center;justify-content:center;margin-bottom:10px;}
.ld-role:first-child .lr-ic{background:var(--blue-050);color:var(--blue-700);}
.lr-name{font-size:16px;font-weight:800;color:var(--grey-900);}
.lr-desc{font-size:12px;color:var(--grey-500);margin-top:5px;line-height:1.45;min-height:52px;}
.lr-go{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:800;color:var(--teal-700);}
.ld-role:first-child .lr-go{color:var(--blue-700);}
.ld-note{margin-top:20px;font-size:11px;color:var(--grey-400);display:flex;align-items:center;gap:7px;justify-content:center;}
.ld-note svg{color:var(--grey-400);}

/* ---------- LOGIN MODAL ---------- */
.login-overlay{position:fixed;inset:0;z-index:9100;background:rgba(11,36,71,.55);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:24px;}
.login-overlay.open{display:flex;}
.login-box{background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);width:100%;max-width:420px;
  overflow:hidden;animation:profileIn .3s ease;}
.login-head{background:linear-gradient(120deg,var(--blue-900),var(--blue-700));color:#fff;padding:24px;display:flex;align-items:center;gap:12px;}
.login-head .lh-ic{width:40px;height:40px;border-radius:10px;background:rgba(127,233,219,.25);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#7fe9db;}
.login-head h3{margin:0;font-size:18px;font-weight:800;flex:1;}
.login-body{padding:28px 24px;}
.login-title{font-size:14px;font-weight:800;color:var(--grey-900);margin-bottom:4px;}
.login-role{font-size:12px;color:var(--grey-500);margin-bottom:18px;text-transform:uppercase;letter-spacing:.05em;}
.form-group{margin-bottom:16px;}
.form-group label{display:block;font-size:12px;font-weight:700;color:var(--grey-700);margin-bottom:6px;text-transform:uppercase;letter-spacing:.03em;}
.form-group input{width:100%;padding:11px 13px;border:1.5px solid var(--grey-200);border-radius:var(--r-md);
  font-size:14px;font-family:var(--font);transition:.13s;}
.form-group input:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(20,168,154,.1);}
.login-error{background:var(--red-bg);border:1.5px solid var(--red);border-radius:var(--r-md);padding:12px 14px;
  font-size:12px;color:var(--red);margin-bottom:16px;display:none;align-items:center;gap:8px;font-weight:600;}
.login-error svg{color:var(--red);flex-shrink:0;}
.login-buttons{display:flex;gap:10px;margin-top:24px;}
.login-btn{flex:1;padding:12px;border-radius:var(--r-md);font-size:13px;font-weight:800;transition:.13s;cursor:pointer;border:none;}
.login-cancel{background:var(--grey-100);color:var(--grey-700);}
.login-cancel:hover{background:var(--grey-200);}
.login-submit{background:linear-gradient(135deg,var(--teal-500),var(--teal-700));color:#fff;box-shadow:var(--shadow-sm);}
.login-submit:hover{filter:brightness(1.08);box-shadow:var(--shadow-md);}
.login-info{font-size:11px;color:var(--grey-500);background:var(--blue-050);border:1px dashed #c7d7ef;
  border-radius:var(--r-md);padding:10px 12px;margin-top:16px;display:flex;gap:8px;align-items:flex-start;line-height:1.5;}
.login-info svg{color:var(--blue-600);flex-shrink:0;margin-top:1px;}

/* ---------- CHATBOT ---------- */
.chat-fab{position:fixed;right:22px;bottom:22px;z-index:6000;width:56px;height:56px;border-radius:50%;
  background:linear-gradient(135deg,#7c3aed,var(--teal-600));color:#fff;display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow-lg);transition:.15s;}
.chat-fab:hover{transform:scale(1.06);}
.chat-panel{position:fixed;right:22px;bottom:88px;z-index:6000;width:340px;max-width:calc(100vw - 32px);height:460px;max-height:calc(100vh - 130px);
  background:#fff;border-radius:var(--r-lg);box-shadow:var(--shadow-lg);display:none;flex-direction:column;overflow:hidden;border:1px solid var(--grey-200);}
.chat-panel.open{display:flex;}
.chat-head{display:flex;align-items:center;gap:8px;padding:13px 14px;background:linear-gradient(120deg,#4c1d95,#7c3aed);color:#fff;}
.chat-head b{font-size:14px;flex:1;}
.ch-ic{display:flex;} .ch-tts,.ch-x{background:rgba(255,255,255,.15);border-radius:7px;padding:4px 7px;color:#fff;font-size:13px;line-height:1;}
.ch-tts.on{background:rgba(255,255,255,.3);}
.chat-msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:9px;background:var(--grey-050);}
.cm{display:flex;} .cm.user{justify-content:flex-end;}
.cm-b{max-width:82%;font-size:13px;line-height:1.45;padding:9px 12px;border-radius:12px;}
.cm.bot .cm-b{background:#fff;border:1px solid var(--grey-200);color:var(--grey-800);border-bottom-left-radius:3px;}
.cm.user .cm-b{background:var(--blue-700);color:#fff;border-bottom-right-radius:3px;}
.chat-in{display:flex;gap:6px;padding:10px;border-top:1px solid var(--grey-200);align-items:center;}
.chat-in input{flex:1;border:1px solid var(--grey-300);border-radius:20px;padding:9px 13px;font-size:13px;font-family:var(--font);}
.chat-in input:focus{outline:none;border-color:var(--blue-500);}
.ch-mic,.ch-send{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ch-mic{background:var(--grey-100);font-size:15px;} .ch-mic:hover{background:var(--grey-200);}
.ch-mic.live{background:var(--red-bg);animation:pulseMic 1s infinite;}
.ch-mic.off{opacity:.5;}
@keyframes pulseMic{0%,100%{box-shadow:0 0 0 0 rgba(220,38,38,.4);}50%{box-shadow:0 0 0 6px rgba(220,38,38,0);}}
.ch-send{background:var(--teal-600);color:#fff;} .ch-send:hover{background:var(--teal-700);}
.chat-note{font-size:9.5px;color:var(--grey-400);text-align:center;padding:6px;border-top:1px solid var(--grey-100);display:flex;align-items:center;gap:5px;justify-content:center;}

/* ---------- AI IN PROFILE ---------- */
.ai-intro{background:#faf5ff;border:1px solid #e9d5ff;border-radius:var(--r-md);padding:18px;text-align:center;}
.ai-intro-t{font-size:13px;color:var(--grey-700);max-width:560px;margin:0 auto 12px;line-height:1.5;}
.ai-run-btn{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(120deg,#4c1d95,#7c3aed);color:#fff;
  font-size:13px;font-weight:800;padding:11px 22px;border-radius:var(--r-sm);transition:.13s;}
.ai-run-btn:hover{filter:brightness(1.08);}
.ai-disc{font-size:11px;color:var(--grey-500);background:var(--grey-050);border:1px dashed var(--grey-300);
  border-radius:var(--r-sm);padding:9px 12px;display:flex;gap:7px;align-items:flex-start;line-height:1.5;}
.ai-disc svg{color:#7c3aed;flex-shrink:0;margin-top:1px;}
.ai-analyzing{background:#faf5ff;border:1px solid #e9d5ff;border-radius:var(--r-md);padding:18px 20px;}
.aia-title{font-size:14px;font-weight:800;color:#6d28d9;display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.aia-step{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--grey-400);padding:5px 0;transition:.2s;}
.aia-step svg{color:var(--grey-300);}
.aia-step.done{color:var(--green);} .aia-step.done svg{color:var(--green);}
.ai-status-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap;}
.ai-date{font-size:11px;color:var(--grey-500);font-weight:600;}
.ai-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;}
.ai-card{background:#fff;border:1px solid var(--grey-200);border-top:3px solid #7c3aed;border-radius:var(--r-md);padding:14px 15px;box-shadow:var(--shadow-sm);}
.ai-card.risk{border-top-color:#dc2626;}
.aic-h{font-size:11px;font-weight:800;color:var(--grey-500);text-transform:uppercase;letter-spacing:.03em;margin-bottom:8px;}
.aic-big{font-size:22px;font-weight:800;}
.aic-pct{font-size:15px;font-weight:800;color:var(--grey-900);margin-top:3px;}
.aic-pct span{font-size:11px;font-weight:600;color:var(--grey-500);}
.aic-conf{font-size:11px;color:var(--grey-500);margin-top:3px;}
.aic-flow{font-size:14px;font-weight:700;color:var(--grey-800);display:flex;align-items:center;gap:6px;}
.aic-flow b{color:#7c3aed;} .aic-flow svg{color:var(--teal-600);}
.aic-val{font-size:16px;font-weight:800;color:var(--teal-700);}
.ai-why{background:#fff;border:1px solid var(--grey-200);border-radius:var(--r-md);padding:15px 16px;margin-top:12px;box-shadow:var(--shadow-sm);}
.aiw-h{font-size:12px;font-weight:800;color:var(--grey-700);display:flex;align-items:center;gap:7px;margin-bottom:9px;}
.aiw-h span{margin-left:auto;color:#7c3aed;font-size:11px;}
.aiw-h svg{color:#7c3aed;}
.aiw-row{display:grid;grid-template-columns:1fr 1.3fr;align-items:center;gap:10px;margin-bottom:6px;font-size:12px;color:var(--grey-700);}
.ai-bar{height:9px;background:var(--grey-100);border-radius:5px;overflow:hidden;}
.ai-bar span{display:block;height:100%;border-radius:5px;}
.ai-drivers{margin:0;padding-left:18px;} .ai-drivers li{font-size:12px;color:var(--grey-700);margin-bottom:3px;}
.ai-evidence{margin-top:9px;font-size:12px;font-weight:600;color:#b45309;background:var(--amber-bg);border-radius:var(--r-sm);padding:8px 11px;display:flex;align-items:center;gap:7px;}
.ai-evidence svg{color:var(--amber);}
.ai-action{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--r-md);padding:15px 16px;margin-top:12px;}
.aia-h{font-size:12px;font-weight:800;color:var(--teal-700);display:flex;align-items:center;gap:7px;}
.aia-h svg{color:var(--teal-600);}
.aia-main{font-size:14px;font-weight:700;color:var(--grey-900);margin:6px 0 10px;}
.aia-checks{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;}
.aia-checks span{font-size:11.5px;font-weight:600;color:var(--green);display:flex;align-items:center;gap:4px;}
.aia-btn{background:var(--teal-700);color:#fff;font-size:12px;font-weight:700;padding:8px 15px;border-radius:var(--r-sm);}
.ai-action .ai-disc,.ai-cards + .ai-why + .ai-action .ai-disc{margin-top:0;}
.ai-status-row + .ai-cards{margin-bottom:0;}
.ai-action{}
.info-card + .ai-disc,.ai-action .ai-disc{margin-top:12px;}

/* ---------- AI INSIGHTS DASHBOARD ---------- */
.ai-kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:6px;}
.ai-kpi{background:#faf5ff;border:1px solid #e9d5ff;border-radius:var(--r-md);padding:18px;text-align:center;}
.ak-v{font-size:30px;font-weight:800;color:#7c3aed;}
.ak-l{font-size:12px;color:var(--grey-600);font-weight:600;margin-top:2px;}
.ai-sec-h{font-size:12px;font-weight:800;color:var(--grey-700);text-transform:uppercase;letter-spacing:.04em;
  margin:18px 0 10px;display:flex;align-items:center;gap:8px;}
.ai-sec-h svg{color:#7c3aed;}
.ai-alerts{display:flex;flex-direction:column;gap:8px;}
.ai-alert{display:grid;grid-template-columns:1fr 1.4fr auto;align-items:center;gap:12px;background:#fff;
  border:1px solid var(--grey-200);border-left:4px solid #7c3aed;border-radius:var(--r-sm);padding:11px 14px;text-align:left;transition:.13s;}
.ai-alert:hover{background:#faf5ff;border-left-color:#dc2626;}
.aa-ul{font-family:var(--mono);font-size:12px;font-weight:700;color:var(--blue-800);}
.aa-k{font-size:12.5px;color:var(--grey-700);}
.aa-s{font-size:14px;font-weight:800;color:#7c3aed;}
.ai-demand{display:grid;grid-template-columns:1fr 1fr;gap:9px;}
.ad-item{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--grey-200);
  border-radius:var(--r-sm);padding:11px 14px;font-size:13px;color:var(--grey-700);font-weight:600;}
.ad-item .up{color:var(--amber);font-size:14px;} .ad-item .hi{color:var(--red);}
.ai-method{background:var(--blue-900);color:#dbe7fb;border-radius:var(--r-sm);padding:12px 14px;font-size:12.5px;font-weight:600;text-align:center;}
.ai-method-tbl{margin-top:10px;border:1px solid var(--grey-200);border-radius:var(--r-sm);overflow:hidden;}
.amt-row{display:grid;grid-template-columns:1fr 1fr 1.4fr;gap:10px;padding:9px 13px;font-size:12px;border-bottom:1px solid var(--grey-100);}
.amt-row:last-child{border-bottom:none;}
.amt-head{background:var(--grey-100);font-weight:800;color:var(--grey-600);text-transform:uppercase;font-size:10px;letter-spacing:.04em;}
.amt-row span:first-child{font-weight:700;color:var(--grey-800);}

@media(max-width:900px){ .ld-roles,.ai-kpis,.ai-demand{grid-template-columns:1fr;} .amt-row{grid-template-columns:1fr;} .amt-row span:nth-child(2),.amt-row span:nth-child(3){color:var(--grey-500);font-size:11px;} }
@media(max-width:720px){ .lang-sel{max-width:88px;} .kpi-tagline{display:none;} }

/* ============================================================
   AI / PREDICTIVE ANALYTICS — local simulated model (AI spec)
   All outputs are PROTOTYPE / SIMULATED, keyed by ULPIN.
   ============================================================ */
function aiFor(p){
  const d=connectedData(p);
  const N=parseInt(p.parcel_id.slice(1));
  const mort=d.mortgage.status==="Active";
  const areaDisc=d.areaDisc;
  const taxDue=d.tax.cls==="warn";
  const disp=d.dispute.status==="Active";
  const bld=d.building.status==="Warning";
  const plan=d.planning.cls==="conflict";
  const restr=d.restriction.status==="Restricted";
  const nearInfra=(N%3!==0);
  // ---- governance review risk ----
  const contrib=[];
  if(mort)contrib.push(["Active mortgage",26]);
  if(areaDisc)contrib.push(["Area discrepancy",22]);
  if(disp)contrib.push(["Recent ownership change / dispute",20]);
  if(taxDue)contrib.push(["Unpaid property tax",14]);
  if(bld)contrib.push(["Building permission gap",12]);
  if(plan)contrib.push(["Planning / land-use conflict",12]);
  let score=contrib.reduce((a,c)=>a+c[1],0);
  if(!contrib.length)contrib.push(["Records consistent",6]);
  score=Math.min(score+ (p.bucket==="conflict"?18:p.bucket==="warning"?8:2), 96);
  const level=score>=70?"High":score>=40?"Medium":"Low";
  const conf=Math.min(95, 74 + (N%5)*4);
  // ---- land-use forecast ----
  let predicted=p.land_use, luProb=32, drivers=["Stable local land use"];
  if(p.land_use==="Agricultural" && nearInfra){ predicted="Residential"; luProb=62+(N%3)*8; drivers=["Nearby residential growth","New road / infrastructure","Zoning permits residential"]; }
  else if(p.land_use==="Mixed"){ predicted="Commercial"; luProb=54+(N%3)*6; drivers=["Increasing built-up activity","Road access","Local commercial demand"]; }
  else if(p.land_use==="Water Body"){ predicted="Conservation"; luProb=90; drivers=["Protected water body","Transfer restricted"]; }
  else { luProb=40+(N%4)*5; drivers=["Established use","Zoning compatibility","Limited nearby change"]; }
  // ---- development / change detection ----
  const changed = inZone(p.parcel_id,"buildingCross")||bld||((p.land_use==="Residential"||p.land_use==="Commercial")&&N%2===0);
  const chConf = changed? (85+(N%4)*3) : (18+(N%3)*6);
  // ---- indicative valuation ----
  const guide=240000+N*63000;
  const vLo=Math.round(guide*0.88/1000)*1000, vHi=Math.round(guide*1.18/1000)*1000;
  const vConf=70+(N%4)*3;
  // ---- development potential ----
  const good=(p.land_use==="Residential"||p.land_use==="Commercial"||p.land_use==="Mixed")&&!restr&&nearInfra;
  const dpLevel=good?"High":(restr||p.land_use==="Water Body"?"Low":"Medium");
  const dpConf=72+(N%5)*4;
  return {
    ulpin:p.ulpin, parcel_id:p.parcel_id,
    governanceRisk:{level,probability:score,confidence:conf,
      factors:contrib.sort((a,b)=>b[1]-a[1]),
      action: level==="High"?"Review parcel before transaction.":level==="Medium"?"Additional verification recommended.":"No immediate action required.",
      checks:["Verify encumbrance","Compare ownership records","Confirm building permission"]},
    landUseForecast:{current:p.land_use,predicted,probability:luProb,horizon:"3 years",factors:drivers,
      checks:["Master Plan","Zoning","Environmental restrictions","Building regulations"]},
    changeDetection:{detected:changed,type:changed?"Potential unregistered development — verification required":"No significant change detected",confidence:chConf},
    valuation:{lo:vLo,hi:vHi,confidence:vConf,factors:["Area","Land use","Road proximity","Zone","Recent transactions","Infrastructure"]},
    developmentPotential:{level:dpLevel,use:good?"Residential / Commercial":"Limited",confidence:dpConf,
      factors:["Zoning","Land use","Road access","Nearby development","Infrastructure"]}
  };
}
// portfolio-level AI summary for the officer dashboard
function aiSummary(){
  const all=parcels.map(aiFor);
  const highRisk=all.filter(a=>a.governanceRisk.level==="High");
  const changes=all.filter(a=>a.changeDetection.detected);
  const conversions=all.filter(a=>a.landUseForecast.predicted!==a.landUseForecast.current && a.landUseForecast.probability>=55);
  const alerts=[];
  highRisk.forEach(a=>alerts.push({pid:a.parcel_id,ulpin:a.ulpin,kind:"High governance risk",score:a.governanceRisk.probability}));
  changes.forEach(a=>alerts.push({pid:a.parcel_id,ulpin:a.ulpin,kind:"Development change",score:a.changeDetection.confidence}));
  conversions.forEach(a=>alerts.push({pid:a.parcel_id,ulpin:a.ulpin,kind:"Likely "+a.landUseForecast.predicted.toLowerCase()+" conversion",score:a.landUseForecast.probability}));
  alerts.sort((x,y)=>y.score-x.score);
  return {highRisk:highRisk.length,changes:changes.length,conversions:conversions.length,
    alerts:alerts.slice(0,8),
    demand:{mutation:18,building:11,ownership:7,workload:"High"}};
}

  return {color:stroke,weight,fillColor:fill,fillOpacity:dim?fillOp:fillOp,opacity:dim?0.35:1,dashArray:dash,className:dim?"parcel-dim":""};
}

function buildParcels(){
  parcelLayer.clearLayers(); labelLayer.clearLayers();
  parcels.forEach(p=>{
    const coords=p.geometry.coordinates[0].map(c=>[c[1],c[0]]);
    const poly=L.polygon(coords,parcelStyle(p,false));
    poly.parcelId=p.parcel_id;
    poly.on('mouseover',function(){ if(state.selected!==p.parcel_id) this.setStyle(parcelStyle(p,true)); showTip(p,this); });
    poly.on('mouseout',function(){ if(state.selected!==p.parcel_id) this.setStyle(parcelStyle(p,false)); });
    poly.on('click',function(){ selectParcel(p.parcel_id,true); });
    poly.bindTooltip(tipHtml(p),{className:"parcel-tip",direction:"top",offset:[0,-4],sticky:true,opacity:1});
    poly.addTo(parcelLayer);
    parcelPolys[p.parcel_id]=poly;
    // ID label
    const lbl=L.marker(p.centroid,{icon:L.divIcon({className:"parcel-label",html:'<div class="pl-inner">'+p.parcel_id+'</div>',iconSize:[40,14],iconAnchor:[20,7]}),interactive:false});
    lbl.addTo(labelLayer);
  });
}
function tipHtml(p){
  const s=STATUS_STYLE[p.bucket];
  return '<div class="tip-inner"><div class="tip-ulpin">'+p.ulpin+'</div>'+
    '<div class="tip-row"><span>Survey</span><span>'+p.survey_number+'</span></div>'+
    '<div class="tip-row"><span>Area</span><span>'+p.area.toFixed(2)+' ac</span></div>'+

}

    parcels.forEach(p=>{const lu=LANDUSE_STYLE[p.land_use];if(lu&&!seen[lu.label]){seen[lu.label]=1;h+=item(lu.color,lu.label);}});

    [["verified"],["warning"],["conflict"],["pending"]].forEach(([k])=>{const s=STATUS_STYLE[k];h+=item(s.color,s.label,'55');});

    h+=item("#2456a6","Parcel",'22');
