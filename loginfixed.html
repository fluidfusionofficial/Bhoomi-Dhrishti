const FILTERS=[
  {key:"risk",label:"Risk",opts:["All","Low","Medium","High"]},
  {key:"status",label:"Ownership status",opts:["All","Verified","Warning","Conflict","Pending"]},
  {key:"landuse",label:"Land Use",opts:["All","Agricultural","Residential","Commercial","Industrial","Mixed","Water Body"]},
  {key:"zoning",label:"Zoning",opts:["All","Agricultural","Residential","Commercial","Industrial","Mixed","Water Body"]},
  {key:"tax",label:"Tax status",opts:["All","Paid","Arrears"]},
  {key:"dispute",label:"Dispute",opts:["All","Active","None"]},
  {key:"building",label:"Building permission",opts:["All","Approved","Warning","N/A"]},
  {key:"restriction",label:"Restriction",opts:["All","Restricted","None"]},
  {key:"area",label:"Area (acres)",opts:["All","<1","1–3","3–5",">5"]},
];
function buildFilters(){
  const box=$("#filterBox"); box.innerHTML="";
  FILTERS.forEach(f=>{
    const g=el("div","filter-group");
    g.innerHTML='<div class="fg-label">'+f.label+'</div>';
    const row=el("div","chip-row");
    f.opts.forEach(o=>{
      const chip=el("button","chip"+(state.filters[f.key]===o?" on":""),o);
      chip.onclick=()=>{state.filters[f.key]=o;buildFilters();refreshParcelStyles();updateResultCount();};
      row.appendChild(chip);
    });
    g.appendChild(row); box.appendChild(g);
  });
}
function filterPass(p){
  const F=state.filters;
  if(F.risk!=="All" && p.risk_level!==F.risk) return false;
  if(F.status!=="All"){
    const b=p.bucket;
    const map0={Verified:"verified",Warning:"warning",Conflict:"conflict",Pending:"pending"};
    if(b!==map0[F.status]) return false;
  }
  const lu = p.land_use==="Mixed Use"?"Mixed":p.land_use;
  if(F.landuse!=="All" && lu!==F.landuse) return false;
  if(F.zoning!=="All" && lu!==F.zoning) return false;
  if(F.area && F.area!=="All"){
    const a=p.area;
    if(F.area==="<1" && !(a<1)) return false;
    if(F.area==="1–3" && !(a>=1&&a<3)) return false;
    if(F.area==="3–5" && !(a>=3&&a<5)) return false;
    if(F.area===">5" && !(a>=5)) return false;
  }
  if((F.tax&&F.tax!=="All")||(F.dispute&&F.dispute!=="All")||(F.building&&F.building!=="All")||(F.restriction&&F.restriction!=="All")){
    const d=connectedData(p);
    if(F.tax!=="All"){ const paid=d.tax.cls!=="warn"; if(F.tax==="Paid"&&!paid)return false; if(F.tax==="Arrears"&&paid)return false; }
    if(F.dispute!=="All"){ const act=d.dispute.status==="Active"; if(F.dispute==="Active"&&!act)return false; if(F.dispute==="None"&&act)return false; }
    if(F.building!=="All"){ const st=d.building.status; const bucket=st==="Warning"?"Warning":(st==="Approved"?"Approved":"N/A"); if(bucket!==F.building)return false; }
    if(F.restriction!=="All"){ const rr=d.restriction.status==="Restricted"; if(F.restriction==="Restricted"&&!rr)return false; if(F.restriction==="None"&&rr)return false; }
  }
  return true;
}
function updateResultCount(){
  const n=parcels.filter(filterPass).length;
  $("#resultCount").textContent=n+" of "+parcels.length+" parcels shown";
}
$("#filterReset").onclick=()=>{state.filters={risk:"All",status:"All",landuse:"All",zoning:"All",tax:"All",dispute:"All",building:"All",restriction:"All",area:"All"};buildFilters();refreshParcelStyles();updateResultCount();toast("Filters reset");};

const searchInput=$("#searchInput"), suggBox=$("#suggestions"), searchClear=$("#searchClear");
function searchParcels(q){
  q=q.trim().toLowerCase(); if(!q)return [];
  const ownerSearchable = state.role!=="citizen"; // owner reference searchable only in officer view (Extension sec 13,22)
  return parcels.filter(p=>{
    const d=connectedData(p);
    const hay=[p.ulpin,p.survey_number,p.subdivision_number,p.parcel_id,p.village,p.taluk,p.district,
      d.registration.extra[0][1],d.building.extra[0][1]] // registration ID + building application ID
      .concat(ownerSearchable?[p.owner]:[])
      .join(" ").toLowerCase();
    return hay.indexOf(q)>=0;
  });
}
let activeSugg=-1;
function renderSuggestions(q){
  const res=searchParcels(q);
  searchClear.style.display=q?"block":"none";
  if(!q){suggBox.style.display="none";return;}
  activeSugg=-1;
  if(res.length===0){
    suggBox.innerHTML='<div class="sugg-empty">No parcels match “'+escapeHtml(q)+'”.<br>Try a ULPIN, survey/subdivision number, village, taluk, district, or an application/document ID.</div>';
    suggBox.style.display="block";return;
  }
  let h='<div class="s-head">'+res.length+' result'+(res.length>1?'s':'')+' found</div>';
  res.forEach((p,i)=>{
    const s=STATUS_STYLE[p.bucket];
    h+='<div class="sugg-item" data-pid="'+p.parcel_id+'" data-i="'+i+'">'+
       '<span class="sid">'+p.parcel_id+'</span>'+
       '<div class="smeta"><div class="l1">'+p.ulpin+'</div>'+
       '<div class="l2">Survey '+p.survey_number+' · '+p.owner+'</div></div>'+
       '<span class="tip-status" style="background:'+s.bg+';color:'+s.fg+';font-size:10px;padding:3px 8px;border-radius:10px;font-weight:700">'+s.label+'</span></div>';
  });
  suggBox.innerHTML=h; suggBox.style.display="block";
  $$(".sugg-item",suggBox).forEach(it=>{
    it.onclick=()=>{ const pid=it.getAttribute("data-pid"); doSearchSelect(pid); };
  });
}
function doSearchSelect(pid){
  suggBox.style.display="none"; searchInput.value="";
  searchClear.style.display="none";
  selectParcel(pid,true);
}
function escapeHtml(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
searchInput.addEventListener("input",e=>renderSuggestions(e.target.value));
searchInput.addEventListener("focus",e=>{if(e.target.value)renderSuggestions(e.target.value);});
searchInput.addEventListener("keydown",e=>{
  const items=$$(".sugg-item",suggBox);
  if(e.key==="ArrowDown"){e.preventDefault();activeSugg=Math.min(activeSugg+1,items.length-1);updateActiveSugg(items);}
  else if(e.key==="ArrowUp"){e.preventDefault();activeSugg=Math.max(activeSugg-1,0);updateActiveSugg(items);}
  else if(e.key==="Enter"){
    if(activeSugg>=0&&items[activeSugg]){items[activeSugg].click();}
    else{const res=searchParcels(searchInput.value);if(res.length)doSearchSelect(res[0].parcel_id);}
  } else if(e.key==="Escape"){suggBox.style.display="none";}
});
function updateActiveSugg(items){items.forEach((it,i)=>it.classList.toggle("active",i===activeSugg));if(items[activeSugg])items[activeSugg].scrollIntoView({block:"nearest"});}
searchClear.onclick=()=>{searchInput.value="";suggBox.style.display="none";searchClear.style.display="none";searchInput.focus();};
document.addEventListener("click",e=>{ if(!e.target.closest(".header-search"))suggBox.style.display="none"; });

  try{
    const res=await fetch(API_URL,{method:"GET",headers:{"Accept":"application/json"}});
    const t1=(performance&&performance.now)?performance.now():Date.now();
    apiState.responseTime=Math.max(1,Math.round(t1-t0));
    apiState.httpStatus=res.status;
    if(!res.ok) throw new Error("HTTP "+res.status);
    const json=await res.json();

    apiState.canonical=mapCanonical(records);
    apiState.lastFetch=new Date();
    apiState.connected=records.length>0;
    if(!apiState.connected){ renderConsole("empty"); updateProvenanceUi(); return; }
    renderConsole("success"); updateProvenanceUi();

  $("#runAiBtn").onclick=()=>{
    const steps=["Loading governance data","Processing spatial features","Evaluating historical patterns","Running predictive models","Generating explanation"];
    mount.innerHTML='<div class="ai-analyzing"><div class="aia-title">'+svg('sparkle',16)+' Analyzing parcel…</div>'+steps.map((s,i)=>'<div class="aia-step" data-i="'+i+'">'+svg('clock',13)+' '+s+'</div>').join('')+'</div>';
    const rows=$$("#aiMount .aia-step");
    rows.forEach((r,i)=>setTimeout(()=>{ r.classList.add("done"); r.querySelector("svg").outerHTML=svg('check',13); if(i===rows.length-1){ aiRun[pid]=true; setTimeout(()=>renderAiResults(mount,pid),300); } },180*(i+1)));
  };
}
LS.wireAi=wireAi;

LS.openAi=openAi;
$("#aiOverlay").onclick=e=>{ if(e.target.id==="aiOverlay")$("#aiOverlay").classList.remove("open"); };

renderLanding();
