server {
    listen      80;
    server_name localhost bhoomidhrishti.local;

    # ── API proxy helpers ─────────────────────────────────────────────────────
    proxy_http_version  1.1;
    proxy_set_header    Host              $host;
    proxy_set_header    X-Real-IP         $remote_addr;
    proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header    X-Forwarded-Proto $scheme;
    proxy_set_header    Connection        "";
    proxy_read_timeout  60s;
    proxy_connect_timeout 10s;

    # ── CORS (handled by FastAPI services) ────────────────────────────────────
    # Note: CORS headers are set by FastAPI backend services
    # Nginx does not need to duplicate these headers

    # ── Health / readiness (no auth required) ────────────────────────────────
    location = /health {
        return 200 '{"status":"ok","service":"nginx-gateway"}';
        add_header Content-Type application/json;
    }

    # ══════════════════════════════════════════════════════════════════════════
    # API routes — versioned under /api/v1/
    # ══════════════════════════════════════════════════════════════════════════

    # Parcel Identity Service
    location /api/v1/parcels {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://parcel_identity;
    }

    location /api/v1/aliases {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://parcel_identity;
    }

    location /api/v1/lineage {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://parcel_identity;
    }

    # Geospatial Service (tiles and geometry)
    location ~ ^/tiles/(\d+)/(\d+)/(\d+)\.pbf$ {
        limit_req zone=tiles burst=100 nodelay;
        proxy_pass http://geospatial;
        add_header Cache-Control "public, max-age=86400";
        add_header Content-Type  "application/vnd.mapbox-vector-tile";
    }

    location /api/v1/geo {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://geospatial;
    }

    location /api/v1/boundaries {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://geospatial;
        add_header Cache-Control "public, max-age=3600";
    }

    # Revenue Records
    location /api/v1/revenue {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://revenue_records;
    }

    # Registration
    location /api/v1/registration {
        limit_req zone=api_general burst=30 nodelay;
        proxy_pass http://registration;
    }

    # Planning and Zoning
    location /api/v1/planning {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://planning_zoning;
    }

    # Fiscal / Property Tax
    location /api/v1/fiscal {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://fiscal;
    }

    # Utilities (water, electricity connections)
    location /api/v1/utilities {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://utilities;
    }

    # Trust Engine (conflict scores, resolution)
    location /api/v1/trust {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://trust_engine;
    }

    # ML Inference
    location /api/v1/ml {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://ml_inference;
    }

    # Citizen Services (land passport, grievances)
    location /api/v1/citizen {
        limit_req zone=api_citizen burst=20 nodelay;
        proxy_pass http://citizen_services;
    }

    # Audit Ledger (restricted to admin/officer roles)
    location /api/v1/audit {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://audit_svc;
    }

    # Notifications
    location /api/v1/notifications {
        limit_req zone=api_general burst=20 nodelay;
        proxy_pass http://notifications;
    }

    # Search
    location /api/v1/search {
        limit_req zone=api_general burst=50 nodelay;
        proxy_pass http://search;
    }

    # Analytics / Reporting
    location /api/v1/analytics {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://analytics;
        proxy_read_timeout 120s;   # Analytics queries may take longer
    }

    # Interoperability (external system connectors)
    location /api/v1/interop {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://interoperability;
    }

    # Satellite Change Detection
    location /api/v1/satellite {
        limit_req zone=api_general burst=10 nodelay;
        proxy_pass http://satellite;
    }

    # ── Service health endpoints (aggregated) ─────────────────────────────────
    location ~ ^/api/v1/internal/health/(.+)$ {
        internal;
        proxy_pass http://$1;
    }

    # ── Keycloak Auth proxy ───────────────────────────────────────────────────
    location /auth/ {
        limit_req zone=auth burst=20 nodelay;
        proxy_pass          http://keycloak:8080/;
        proxy_set_header    Host              $host;
        proxy_set_header    X-Real-IP         $remote_addr;
        proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header    X-Forwarded-Proto $scheme;
        proxy_buffer_size   128k;
        proxy_buffers       4 256k;
    }

    # ── Frontend (served by Next.js; stub for now) ─────────────────────────
    location / {
        return 200 '{"message":"Bhoomi Dhrishti API Gateway","version":"1.0.0","docs":"/api/v1/parcels/docs"}';
        add_header Content-Type application/json;
    }

    # ── Error pages ───────────────────────────────────────────────────────────
    error_page 502 503 504 /50x.json;
    location = /50x.json {
        return 502 '{"error":"upstream_unavailable","message":"Service temporarily unavailable"}';
        add_header Content-Type application/json;
    }
}
