user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  2048;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    log_format json_combined escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_time":"$upstream_response_time",'
        '"user_agent":"$http_user_agent"}';

    access_log  /var/log/nginx/access.log  json_combined;

    # ── Performance ───────────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    6;
    gzip_types         text/plain text/css application/json application/javascript
                       application/x-javascript text/xml application/xml
                       application/xml+rss text/javascript application/geo+json
                       application/vnd.mapbox-vector-tile;

    # ── Security headers ──────────────────────────────────────────────────────
    add_header X-Frame-Options          DENY;
    add_header X-Content-Type-Options   nosniff;
    add_header X-XSS-Protection         "1; mode=block";
    add_header Referrer-Policy          strict-origin-when-cross-origin;
    add_header Permissions-Policy       "geolocation=(), microphone=(), camera=()";
    server_tokens                       off;

    # ── Rate limiting ─────────────────────────────────────────────────────────
    limit_req_zone  $binary_remote_addr  zone=api_general:20m   rate=100r/m;
    limit_req_zone  $binary_remote_addr  zone=api_citizen:20m   rate=30r/m;
    limit_req_zone  $binary_remote_addr  zone=tiles:20m         rate=300r/m;
    limit_req_zone  $binary_remote_addr  zone=auth:10m          rate=10r/m;

    # ── Upstream definitions ──────────────────────────────────────────────────
    upstream parcel_identity    { server parcel-identity:8000;    keepalive 32; }
    upstream geospatial         { server geospatial:8000;         keepalive 32; }
    upstream revenue_records    { server revenue-records:8000;    keepalive 32; }
    upstream registration       { server registration:8000;       keepalive 32; }
    upstream planning_zoning    { server planning-zoning:8000;    keepalive 32; }
    upstream fiscal             { server fiscal:8000;             keepalive 32; }
    upstream utilities          { server utilities:8000;          keepalive 32; }
    upstream trust_engine       { server trust-engine:8000;       keepalive 32; }
    upstream ml_inference       { server ml-inference:8000;       keepalive 32; }
    upstream citizen_services   { server citizen-services:8000;   keepalive 32; }
    upstream audit_svc          { server audit:8000;              keepalive 32; }
    upstream notifications      { server notifications:8000;      keepalive 32; }
    upstream search             { server search:8000;             keepalive 32; }
    upstream analytics          { server analytics:8000;          keepalive 32; }
    upstream interoperability   { server interoperability:8000;   keepalive 32; }
    upstream satellite          { server satellite:8000;          keepalive 32; }

    # ── Virtual host config ───────────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
