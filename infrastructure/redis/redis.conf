# ─────────────────────────────────────────────────────────────────────────────
# Bhoomi Dhrishti – Redis Configuration
# ─────────────────────────────────────────────────────────────────────────────

# Network
bind 0.0.0.0
port 6379
protected-mode yes

# Auth (password set via --requirepass CLI arg from docker-compose)
# requirepass is passed as CLI argument; do not set here to avoid double declaration

# Persistence
# Save if at least 1 key changed in 900 seconds
save 900 1
# Save if at least 10 keys changed in 300 seconds
save 300 10
# Save if at least 10000 keys changed in 60 seconds
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Memory
maxmemory 512mb
maxmemory-policy allkeys-lru

# Keyspace expiry notifications (for cache invalidation events)
notify-keyspace-events "Kx"

# Logging
loglevel notice
logfile ""

# Performance
hz 10
dynamic-hz yes
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# Slow log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Databases
databases 16
# DB 0 – general cache (API responses, parcel summaries)
# DB 1 – session tokens / rate-limit counters
# DB 2 – search result cache
# DB 3 – tile cache keys
# DB 4 – ML score cache
